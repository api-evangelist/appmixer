- aid: appmixer:appmixer-user-groups-api
  name: Appmixer User Groups API
  description: >-
    User Groups (also known as Workspaces) let teams collaborate by sharing resources such as flows,

    data stores and files. Group resources are owned by the group rather than by individual users,

    while audit logs keep track of the individual user actions. Admin users are automatically added

    to the default admin group. Users can switch between their personal context and a group context;

    the access token then carries the group information.
  humanURL: https://docs.appmixer.com/getting-started/api
