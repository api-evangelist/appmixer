                name: CRM & Sales
                description: Customer relationship management and sales tools
                created: 2023-03-15T17:27:14.567Z
                mtime: 2023-03-15T18:41:18.901Z
        "400":
          description: Validation failed or a category with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 400
                error: Bad Request
                message: Category with this name already exists.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: Category not found.
      parameters:
        - $ref: "#/components/parameters/CategoryIdParam"
    delete:
      tags:
        - Integration Categories
      summary: Delete Category
      operationId: deleteCategory
      description: |
        Delete a category. Requires the `admin` scope. The category is automatically removed from all
        integration templates and drafts that reference it.
      responses:
        "200":
          description: Category deleted. Empty object.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Category not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: Category not found.
      parameters:
        - $ref: "#/components/parameters/CategoryIdParam"
