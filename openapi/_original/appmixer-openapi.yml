# Appmixer REST API - OpenAPI 3.1 specification.
# Covers the endpoints documented in the API section of these docs. Paths, parameters and
# payload validation were checked against the appmixer-core route definitions (gridd/routes) on the release-6.5 branch.
# When you change an API page, update the matching operation here as well.
openapi: 3.1.0
info:
  title: Appmixer REST API
  version: 6.5.5
  summary: REST API of the Appmixer workflow automation and embedded iPaaS platform.
  description: |
    Appmixer offers a REST API that mirrors the functionality available in its UI. Use it for
    advanced customizations, additional automations and scripting.

    **Base URL.** The base URL depends on your Appmixer tenant, for example `https://api-acme.appmixer.ai`
    (newer hosted tenants), `https://api.acme.appmixer.cloud` (older hosted tenants), or the API URL of
    your Self-Managed installation.

    **Authentication.** Most endpoints require a user access token sent as `Authorization: Bearer <token>`.
    Get a token by signing in with `POST /user/auth`. Some endpoints also require the user to have
    the `admin` scope; this is noted in their descriptions.

    **Errors.** Errors are returned as JSON objects with `statusCode`, `error` and `message` properties.
  contact:
    name: Appmixer
    url: https://www.appmixer.com
externalDocs:
  description: Appmixer documentation
  url: https://docs.appmixer.com
servers:
  - url: "{tenantApiUrl}"
    description: Your Appmixer tenant API
    variables:
      tenantApiUrl:
        default: https://api-acme.appmixer.ai
        description: API URL of your Appmixer tenant, e.g. https://api-acme.appmixer.ai or https://api.acme.appmixer.cloud.
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: User access token obtained from `POST /user/auth`.
  schemas:
    Error:
      type: object
      description: Error response.
      properties:
        statusCode:
          type: integer
          example: 404
        error:
          type: string
          example: Not Found
        message:
          type: string
          example: Flow not found.
      required:
        - statusCode
        - error
    FlowType:
      type: string
      description: Flow type.
      enum:
        - automation
        - automation-draft
        - integration-draft
        - integration-template
        - integration-instance
        - custom-integration-instance
        - integration-instance-draft
        - integration-test
    FlowStage:
      type: string
      description: Flow stage (state).
      enum:
        - starting
        - running
        - stopped
        - paused
        - updating
        - paused-by-user
    FlowComponent:
      type: object
      description: One component of a flow descriptor.
      properties:
        type:
          type: string
          minLength: 1
          description: Component type, e.g. `appmixer.utils.email.SendEmail`.
        label:
          type: string
        source:
          type:
            - object
            - "null"
          description: "Input connections, `{ <inputPort>: { <sourceComponentId>: [<outputPort>, ...] } }`."
          additionalProperties: true
        config:
          type:
            - object
            - "null"
          description: Component configuration, including `properties` and input `transform`s.
          additionalProperties: true
        errorHandling:
          $ref: "#/components/schemas/FlowComponentErrorHandling"
        x:
          type:
            - number
            - string
        y:
          type:
            - number
            - string
      required:
        - type
      additionalProperties: true
    FlowComponentErrorHandling:
      type:
        - object
        - "null"
      description: |
        How an unresolved error (an error that remains after automatic retries) is handled. With
        `onError: errorPort`, the error is routed to a virtual `error` output port that can be wired
        to any downstream component.
      properties:
        autoRetry:
          type: boolean
          default: true
          description: Whether the engine retries the failed message automatically.
        maxRetries:
          type: integer
          description: Optional override of the number of retries (bounded by the system retry backoff configuration).
        onError:
          type: string
          enum:
            - errorPort
            - stopFlow
            - storeUnprocessed
          default: storeUnprocessed
          description: What happens once retries are exhausted or disabled.
      additionalProperties: true
    FlowDescriptor:
      type: object
      description: The flow descriptor, a map of component ID to component.
      additionalProperties:
        $ref: "#/components/schemas/FlowComponent"
    FlowNote:
      type: object
      description: A note block displayed on the Designer canvas.
      properties:
        x:
          type: number
          description: Horizontal position on the canvas (pixels, can be negative).
        y:
          type: number
          description: Vertical position on the canvas (pixels, can be negative).
        width:
          type: number
        height:
          type: number
        content:
          type: string
          description: CommonMark Markdown displayed inside the note block.
      required:
        - x
        - y
        - width
        - height
    FlowNotes:
      type: object
      description: Map of note ID (UUID) to note object.
      additionalProperties:
        $ref: "#/components/schemas/FlowNote"
      example:
        ec488c75-b240-4b8a-8939-e05ba4af32a4:
          x: -368
          y: -128
          width: 432
          height: 288
          content: |-
            ## My note

            Supports **Markdown** content.
    FlowWizardField:
      type: object
      description: One field of an Integration Template wizard.
      properties:
        type:
          type: string
          enum:
            - inspectorField
            - account
            - customField
            - text
            - image
        label:
          type: string
        tooltip:
          type: string
        placeholder:
          type: string
        source:
          type: string
          description: Path to the bound component input, `<componentId>.<descriptorPath>`.
        attrs:
          type: object
          description: Type-specific attributes (e.g. `service`, `components`, `sharedAccountId` for `account` fields).
          additionalProperties: true
        options:
          type: object
          additionalProperties: true
      additionalProperties: true
    FlowWizard:
      type:
        - object
        - "null"
      description: |
        Wizard configuration. A flow with a non-empty `wizard` (and no `templateId`) is an Integration
        Template.
      properties:
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FlowWizardField"
      additionalProperties: true
    FlowSharedWith:
      type: object
      description: Sharing rule. Exactly one of `email`, `domain` or `scope` must be set.
      properties:
        email:
          type: string
          format: email
        domain:
          type: string
        scope:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum:
              - read
              - start
              - stop
      required:
        - permissions
    FlowPayload:
      type: object
      description: Flow properties accepted by Create Flow and Update Flow.
      additionalProperties: false
      properties:
        flow:
          $ref: "#/components/schemas/FlowDescriptor"
        name:
          type: string
          description: Name of the flow.
        customFields:
          type: object
          additionalProperties: true
          description: |
            Any custom properties. Useful for storing custom metadata and later filtering flows by it
            (e.g. `filter=customFields.category:healthcare`).
        thumbnail:
          type: string
          description: Flow thumbnail image (data URI).
        notes:
          $ref: "#/components/schemas/FlowNotes"
        wizard:
          $ref: "#/components/schemas/FlowWizard"
        sharedWith:
          type: array
          items:
            $ref: "#/components/schemas/FlowSharedWith"
        type:
          $ref: "#/components/schemas/FlowType"
        categories:
          type: array
          items:
            type: string
          description: Category IDs. Only allowed for `integration-template` and `integration-draft` flows.
        description:
          type:
            - string
            - "null"
        image:
          type:
            - string
            - "null"
        mode:
          type: string
          enum:
            - module
        stage:
          type: string
        model:
          type: string
        svg:
          type: string
        inspector:
          type: object
          additionalProperties: true
        revision:
          type:
            - number
            - "null"
        componentIdMap:
          type: object
          additionalProperties: true
        templateId:
          type: string
        originFlowId:
          type: string
          description: Cannot be changed once set.
    FlowCreatePayload:
      description: Create Flow payload. Same as `FlowPayload`, but `flow` is required.
      allOf:
        - $ref: "#/components/schemas/FlowPayload"
        - type: object
          required:
            - flow
    Flow:
      type: object
      description: A flow.
      properties:
        flowId:
          type: string
        userId:
          type: string
          description: ID of the flow owner.
        name:
          type: string
        stage:
          $ref: "#/components/schemas/FlowStage"
        type:
          $ref: "#/components/schemas/FlowType"
        btime:
          type: string
          format: date-time
          description: Creation time.
        mtime:
          type: string
          format: date-time
          description: Last modification time.
        started:
          type: string
          format: date-time
          description: Time the flow was last started.
        flow:
          $ref: "#/components/schemas/FlowDescriptor"
        notes:
          $ref: "#/components/schemas/FlowNotes"
        wizard:
          $ref: "#/components/schemas/FlowWizard"
        mode:
          type: string
        thumbnail:
          type: string
        customFields:
          type: object
          additionalProperties: true
        sharedWith:
          type: array
          items:
            $ref: "#/components/schemas/FlowSharedWith"
        categories:
          type: array
          items:
            type: string
        templateId:
          type: string
        originFlowId:
          type: string
        componentIdMap:
          type: object
          additionalProperties: true
        revision:
          type:
            - number
            - "null"
        description:
          type:
            - string
            - "null"
        image:
          type:
            - string
            - "null"
        runtimeErrors:
          type: array
          description: Get Flow only, running flows only. Recent error log records.
          items:
            type: object
            additionalProperties: true
        draft:
          type: object
          description: Get Flow only, drafts only.
          properties:
            hasChanges:
              type: boolean
              description: Whether publishing the draft would change the original flow.
      additionalProperties: true
    FlowUpdateResult:
      type: object
      properties:
        flowId:
          type: string
        result:
          type: string
          examples:
            - updated
        flow:
          $ref: "#/components/schemas/FlowDescriptor"
      additionalProperties: true
    FlowClonePayload:
      type:
        - object
        - "null"
      description: Clone options.
      additionalProperties: false
      properties:
        prefix:
          type: string
          description: Prefix for the clone's name (the original flow name is used with this prefix).
        projection:
          type: string
          description: Properties not to clone, e.g. `-thumbnail,-sharedWith`.
        connectAccounts:
          type: boolean
          default: false
          description: |
            Connect the accounts connected to the source flow components to the cloned components too.
            Only possible when the owner of the clone is the owner of the original flow.
        connectSharedAccounts:
          type: boolean
        autoConnectAccounts:
          oneOf:
            - type: boolean
            - type: string
              const: preferred
          description: See the `autoConnectAccounts` query parameter.
        isTemplateInstance:
          type: boolean
          default: false
          description: The source flow is an instance of a template (Integrations).
        setOriginFlowId:
          type: boolean
          default: false
          description: Set the `originFlowId` of the clone to the original flow.
        setComponentIdMap:
          type: boolean
          default: true
          description: Store a map of the original component IDs to the clone's component IDs (used by Integrations and drafts).
        includeNotes:
          type: boolean
        additional:
          type: object
          description: Properties set on the clone.
          additionalProperties: false
          properties:
            sharedWith:
              type: array
              items:
                $ref: "#/components/schemas/FlowSharedWith"
            type:
              $ref: "#/components/schemas/FlowType"
            wizard:
              $ref: "#/components/schemas/FlowWizard"
    FlowCloneResult:
      type: object
      properties:
        cloneId:
          type: string
      required:
        - cloneId
    FlowVersionType:
      type: string
      enum:
        - manual
        - autosave
        - publish
        - restore-point
    FlowVersion:
      type: object
      description: |
        A flow version snapshot. List Versions returns metadata only; Get Version also includes
        `flow`, `notes`, `customFields` and `wizard`.
      properties:
        versionId:
          type: string
          format: uuid
        flowId:
          type: string
        userId:
          type: string
          description: ID of the flow owner.
        versionNumber:
          type: integer
        type:
          $ref: "#/components/schemas/FlowVersionType"
        label:
          type:
            - string
            - "null"
        name:
          type: string
        btime:
          type: string
          format: date-time
        flow:
          $ref: "#/components/schemas/FlowDescriptor"
        notes:
          $ref: "#/components/schemas/FlowNotes"
        customFields:
          type: object
          additionalProperties: true
        wizard:
          $ref: "#/components/schemas/FlowWizard"
      additionalProperties: true
    Account:
      type: object
      description: An account (credentials) the user authenticated with to a connector app.
      properties:
        accountId:
          type: string
          description: Account ID.
        userId:
          type: string
          description: ID of the owner of the account.
        name:
          type: string
          description: Name of the account, usually derived from the profile info.
        displayName:
          type:
            - string
            - "null"
          description: Display name that overrides `name` in the UI.
        email:
          type:
            - string
            - "null"
        service:
          type: string
          description: Service ID (`vendor:service`), e.g. `appmixer:slack`.
        profileInfo:
          type:
            - object
            - "null"
          additionalProperties: true
          description: Profile info returned by the auth module.
        pre:
          type:
            - object
            - "null"
          additionalProperties: true
          description: Values of the auth module `pre` fields.
        revoked:
          type:
            - boolean
            - "null"
        authVariablesId:
          type:
            - string
            - "null"
          description: ID of the custom (user-specific) auth configuration used by the account.
      required:
        - accountId
        - service
    AccountCreateRequest:
      type: object
      additionalProperties: true
      properties:
        service:
          type: string
          description: ID (`vendor:service`) of the service, for example `appmixer:google`.
        token:
          type: object
          additionalProperties: true
          description: The structure of this object depends on the authentication type (OAuth 1, OAuth 2, API Key, password).
          properties:
            accessToken:
              type: string
              description: Access token (required for OAuth).
            accessTokenSecret:
              type: string
              description: Access token secret (required for OAuth 1).
            refreshToken:
              type: string
              description: Refresh token (OAuth 2).
            expDate:
              type: string
              description: Expiration date of the access token (OAuth 2).
            scope:
              type: array
              items:
                type: string
              description: Scopes the access token was granted (OAuth).
        profileInfo:
          type: object
          additionalProperties: true
          description: Can be provided directly. If not, `requestProfileInfo` from the authentication module will be called.
        name:
          type: string
          description: Name of the account. If not set, the authentication module determines the name using `accountNameFromProfileInfo`.
        displayName:
          type: string
          description: Display name of the account. This overrides the name of the account in the frontend.
      required:
        - service
    AccountTokenAuthStatus:
      type: object
      description: Status of an account's token for a component type.
      additionalProperties: true
      properties:
        accessTokenValid:
          type: boolean
        accountId:
          type: string
        tokenId:
          type: string
        componentAssigned:
          type: boolean
          description: Whether the account is assigned to the component given by `componentId`.
        componentId:
          type: string
        scopeValid:
          type: boolean
        authorizedScope:
          type: array
          items:
            type: string
        name:
          type: string
        displayName:
          type:
            - string
            - "null"
    AccountComponentTypeAuth:
      type: object
      properties:
        componentType:
          type: string
        auth:
          type: object
          properties:
            accounts:
              type: object
              description: Map of account ID to token status. Missing if there are no accounts.
              additionalProperties:
                $ref: "#/components/schemas/AccountTokenAuthStatus"
            connectAccountButton:
              type: object
              additionalProperties: true
              description: Custom "connect account" button definition from the service manifest, if any.
      required:
        - componentType
        - auth
    AccountAuthSessionStatus:
      type: object
      description: Status of an authentication session.
      additionalProperties: true
      properties:
        accountId:
          type: string
        tokenId:
          type: string
        finished:
          type: boolean
          description: Whether the authentication flow has finished.
        updatedAt:
          type: string
          format: date-time
        error:
          description: Error message if the authentication failed.
          type:
            - string
            - object
            - "null"
    ServiceConfig:
      type: object
      description: Configuration of a service. Besides `serviceId`, it can contain any key/value pairs.
      additionalProperties: true
      properties:
        serviceId:
          type: string
          description: The service ID in the form `vendor:service`, e.g. `appmixer:google`.
        scope:
          type: string
          description: Scope the configuration applies to. Missing for system-wide configurations.
        userId:
          type: string
          description: ID of the user the configuration belongs to (user-specific configuration).
    UserDetail:
      type: object
      description: User as returned by the sign-in, sign-up and current user endpoints.
      properties:
        id:
          type: string
          description: User ID.
        username:
          type: string
        isActive:
          type: boolean
        email:
          type: string
          format: email
        plan:
          type: string
        scope:
          type: array
          items:
            type: string
          description: User scopes, for example `user` or `admin`.
        vendor:
          description: One or more vendors.
          oneOf:
            - type:
                - string
                - "null"
            - type: array
              items:
                type: string
        created:
          type:
            - string
            - integer
          description: Creation time (ISO date string, or a timestamp in milliseconds for some users).
        metadata:
          type: object
          description: Custom metadata.
        aiContext:
          type:
            - string
            - "null"
          description: Per-user context for AI Copilot.
        type:
          type: string
          enum:
            - personal
            - group
          description: "`group` for the internal users that own User Group resources."
    UserRecord:
      type: object
      description: User record as returned by the admin user endpoints (the stored user without the password).
      properties:
        _id:
          type: string
          description: User ID.
        username:
          type: string
        email:
          type: string
          format: email
        isActive:
          type: boolean
        plan:
          description: Subscription plan.
          oneOf:
            - type: string
            - type: object
        scope:
          type: array
          items:
            type: string
        allowedPrivateComponents:
          type: array
          items:
            type: string
        phoneNumber:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
        vendor:
          oneOf:
            - type:
                - string
                - "null"
            - type: array
              items:
                type: string
        created:
          type:
            - string
            - integer
          description: Creation time (ISO date string, or a timestamp in milliseconds for some users).
        metadata:
          type: object
        aiContext:
          type:
            - string
            - "null"
        sso:
          type:
            - object
            - "null"
          description: SSO identity details, `null` for users that don't sign in with SSO.
        type:
          type: string
          enum:
            - personal
            - group
      additionalProperties: true
    UserAuthResponse:
      type: object
      required:
        - user
        - token
      properties:
        user:
          $ref: "#/components/schemas/UserDetail"
        token:
          type: string
          description: "Access token (JWT). Send it as `Authorization: Bearer <token>`."
    UserCreateRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          description: Username, usually the email address.
        email:
          type: string
          format: email
          description: Email address.
        password:
          type: string
          minLength: 12
          description: |
            Password. The minimum length is set by the `USER_PASSWORD_MIN_LENGTH` environment variable
            (12 by default).
        phoneNumber:
          type:
            - string
            - "null"
        title:
          type:
            - string
            - "null"
        metadata:
          type: object
          description: Optional metadata.
        aiContext:
          type:
            - string
            - "null"
          description: |
            Optional per-user context for AI Copilot. Requires an admin token. The maximum length is set by
            `USER_AI_CONTEXT_MAX_LENGTH`.
        signUpCoupon:
          type: string
          description: Sign-up coupon code.
    UserUpdateRequest:
      type: object
      properties:
        scope:
          type: array
          items:
            type: string
          description: Array of scopes.
        vendor:
          description: One or more vendors.
          oneOf:
            - type:
                - string
                - "null"
            - type: array
              items:
                type: string
        metadata:
          type: object
          description: Metadata (replaces the existing metadata).
        email:
          type: string
          format: email
          description: Email address.
        username:
          type: string
          description: Username.
        aiContext:
          type:
            - string
            - "null"
          description: |
            Optional per-user context for AI Copilot. Send `null` to clear it. The maximum length is set by
            `USER_AI_CONTEXT_MAX_LENGTH`.
    UserMessage:
      type: object
      properties:
        message:
          type: string
    UserTaskTicket:
      type: object
      required:
        - ticket
      properties:
        ticket:
          type: string
          description: Ticket of the background task.
    UserTaskStatus:
      type: object
      properties:
        status:
          type: string
          enum:
            - in-progress
            - completed
            - failed
            - cancelled
        stepsDone:
          type: integer
          description: Number of steps done; can be used to display a progress bar.
        stepsTotal:
          type: integer
          description: Total number of steps; can be used to display a progress bar.
    UserGroup:
      type: object
      properties:
        id:
          type: string
          description: Group ID.
        groupUserId:
          type: string
          description: ID of the internal group user that owns the group's resources.
        name:
          type: string
        metadata:
          type: object
        isDefault:
          type: boolean
          description: "`true` for the default admin group, which cannot be updated or deleted."
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        members:
          type: array
          description: IDs of the active members. Returned by the admin group endpoints only.
          items:
            type: string
    UserGroupContext:
      type: object
      properties:
        id:
          type: string
          description: Group ID.
        groupUserId:
          type: string
          description: ID of the internal group user.
        name:
          type: string
        metadata:
          type: object
        isDefault:
          type: boolean
    UserGroupMembership:
      type: object
      properties:
        groupId:
          type: string
        userId:
          type: string
        addedBy:
          type: string
          description: ID of the user who added the member.
        addedAt:
          type: string
          format: date-time
    UserGroupMember:
      type: object
      properties:
        userId:
          type: string
        email:
          type: string
          format: email
        username:
          type: string
        addedAt:
          type: string
          format: date-time
        addedBy:
          type: string
          description: ID of the user who added the member.
    UserContextSwitchResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: New access token for the selected context.
        user:
          type: object
          properties:
            id:
              type: string
              description: The personal user ID, or the group user ID in a group context.
            contextType:
              type: string
              enum:
                - personal
                - group
            originalUserId:
              type: string
              description: The actual user ID (group context only).
            groupId:
              type: string
              description: Group context only.
            groupName:
              type: string
              description: Group context only.
    AclType:
      type: string
      enum:
        - routes
        - components
    AclRule:
      type: object
      required:
        - role
        - resource
        - action
      properties:
        role:
          type: string
          minLength: 1
          description: User scope (role) the rule applies to, for example `admin`, `user` or `tester`.
        resource:
          type: string
          minLength: 1
          description: |
            Resource the rule applies to. For routes, `*` or a route resource such as `flows`; for components,
            a component type pattern such as `appmixer.utils.*`.
        action:
          type: array
          minItems: 1
          items:
            type: string
          description: Allowed (or, with a `!` prefix, denied) actions, for example `*`, `read`, `!delete` or `use`.
        attributes:
          type: array
          minItems: 1
          items:
            type: string
          description: Rule attributes, for example `non-private` or `private` for components.
    App:
      type: object
      description: An app (module, or service without modules) as defined in its `module.json`/`service.json`.
      properties:
        name:
          type: string
          examples:
            - appmixer.asana
        label:
          type: string
        category:
          type: string
        description:
          type: string
        icon:
          type: string
          description: Icon URL (default) or inline data URI (with `compressIcons=false`).
      additionalProperties: true
    AppBundle:
      type: object
      properties:
        version:
          type: string
          examples:
            - 1.2.0
    ComponentManifest:
      type: object
      description: Component manifest (`component.json`). See the component manifest documentation for all fields.
      properties:
        name:
          type: string
          examples:
            - appmixer.twilio.sms.SendSMS
        label:
          type: string
        author:
          type: string
        description:
          type: string
        icon:
          type: string
        auth:
          type: object
          additionalProperties: true
        webhook:
          type: boolean
        webhookAsync:
          type: boolean
        private:
          type: boolean
        inPorts:
          type: array
          items:
            type: object
            additionalProperties: true
        outPorts:
          type: array
          items:
            type: object
            additionalProperties: true
        properties:
          type: object
          additionalProperties: true
      additionalProperties: true
    ComponentUploadTicket:
      type: object
      properties:
        ticket:
          type: string
          format: uuid
      required:
        - ticket
    ComponentUploadStatus:
      type: object
      properties:
        finished:
          type: string
          format: date-time
          description: Present when the upload finished.
        err:
          type: string
          description: Error message when the upload failed.
        data:
          description: Error details, e.g. schema validation errors.
      additionalProperties: true
    ComponentStaticCallRequest:
      type: object
      description: Either `componentId` or `callerId` is required.
      properties:
        componentId:
          type: string
          description: ID of a component instance (used to resolve the connected account).
        callerId:
          type: string
          description: ID of the calling component instance.
        properties:
          type: object
          additionalProperties: true
          description: Component properties.
        messages:
          type: object
          additionalProperties: true
          description: Input messages keyed by input port.
        log:
          type: boolean
          default: false
          description: "When `true`, the call is recorded in the execution logs (marked with `staticCall: true`) and surfaces in the Logs API and the Insights UI. Primarily used for AI Agent tools observability."
        correlationId:
          type: string
          description: Optional correlation ID stored in the log record when `log` is `true`.
        testRunId:
          type: string
          description: Marks the log records as produced by a flow test run.
      additionalProperties: true
    Category:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        created:
          type: string
          format: date-time
        mtime:
          type: string
          format: date-time
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Category name, must be unique.
        description:
          type: string
          maxLength: 500
      required:
        - name
      additionalProperties: false
    CategoryUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
          maxLength: 500
      additionalProperties: false
    ModifierCategory:
      type: object
      properties:
        label:
          type: string
          description: Label shown in the Modifier Editor. Can be overridden by string customization.
        index:
          type: number
          description: Position on which this category is displayed in the Modifier Editor.
      required:
        - label
        - index
    ModifierArgument:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
        description:
          type: string
        options: {}
        defaultValue: {}
        isHash:
          type: boolean
        isBlock:
          type: boolean
        multiline:
          type: boolean
      required:
        - name
        - type
    Modifier:
      type: object
      properties:
        name:
          type: string
          description: Kept for backward compatibility.
        label:
          type: string
          description: Label shown in the Modifier Editor. Can be overridden by string customization.
        category:
          type: array
          items:
            type: string
          description: Categories the modifier appears under.
        description:
          type: string
        type:
          type: string
        tooltip:
          type: string
        arguments:
          type: array
          items:
            $ref: "#/components/schemas/ModifierArgument"
          description: Arguments of the modifier; an inspector field is generated for each.
        returns:
          type: object
          properties:
            type:
              type: string
          required:
            - type
        helperFn:
          type: string
          description: The JavaScript function as a string. The first argument is always the variable value, followed by the modifier's arguments in the order they are defined.
        variableArguments:
          type: boolean
          description: When `true`, the modifier accepts any number of arguments.
        isBlock:
          type: boolean
          description: Indicates a block modifier.
        private:
          type: boolean
          description: Private modifiers are not available to users.
        usesPartials:
          type: boolean
        partialVariables:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
      required:
        - label
        - category
        - description
        - helperFn
    ModifierDefinitions:
      type: object
      properties:
        categories:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ModifierCategory"
        modifiers:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/Modifier"
      required:
        - categories
        - modifiers
    ModifierTestRequest:
      type: object
      properties:
        helperFn:
          type: string
          description: The JavaScript helper function as a string.
        arguments:
          type: array
          items: {}
          description: The arguments to be passed to the helper function.
      required:
        - helperFn
        - arguments
    ConfigEntry:
      type: object
      properties:
        key:
          type: string
          description: Configuration key.
        value:
          type: string
          description: Configuration value (structured values as JSON strings).
      required:
        - key
        - value
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          description: ID of the entry.
        created:
          type: string
          format: date-time
          description: When the entry was recorded.
        eventType:
          type: string
          enum:
            - create
            - update
            - delete
        status:
          type: string
          enum:
            - success
            - failure
        action:
          type: string
          description: Description of the event.
          example: "Update flow: Sync new bookings [9089f275-f5a5-4796-ba23-365412c5666e]"
        user:
          type:
            - object
            - "null"
          description: |
            The Appmixer user who made the change. In a user group context, `id` and `username` are those
            of the group user, and `originalUserId`, `contextType` and `groupId` identify the person and the group.
          properties:
            id:
              type: string
            username:
              type: string
            lowername:
              type: string
              description: The username in lowercase.
            originalUserId:
              type: string
            contextType:
              type: string
            groupId:
              type: string
        flowId:
          type:
            - string
            - "null"
          description: ID of the flow the change concerns.
        flowName:
          type:
            - string
            - "null"
        diff:
          type: array
          description: The changed properties.
          items:
            type: object
            properties:
              path:
                type: string
                example: flow.name
              type:
                type: string
                enum:
                  - CREATE
                  - CHANGE
                  - REMOVE
              changes:
                type: object
                properties:
                  before: {}
                  after: {}
        flatDiff:
          type: string
          description: "`diff` as a JSON string."
        source:
          type: string
          enum:
            - copilot
          description: Present only on changes made by the AI Copilot.
        threadId:
          type: string
          description: ID of the AI Copilot conversation that made the change. Present only together with `source`.
        externalUserId:
          type: string
          description: ID sent in the `X-Appmixer-Audit-External-User-Id` request header. Present only when the request carried a valid one.
    AuditLogList:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AuditLogEntry"
        contentRange:
          type: string
          description: The part of the whole result this page holds, as `<first>-<last>/<total>` counted from zero.
          example: 0-49/120
        appliedFilters:
          type: array
          description: |
            Names of the filter parameters the server recognized and applied, in no particular order.
            Versions that predate it do not return it; treat such a response as unfiltered.
          items:
            type: string
      required:
        - data
        - contentRange
    LogRecord:
      type: object
      description: |
        A log record (Elasticsearch document source). The set of fields depends on the variant,
        which can be identified by the `id`, `indexPrefix`, `severity`, `type` and `portType` fields:

        | Variant | id | indexPrefix | severity | type | portType |
        | --- | --- | --- | --- | --- | --- |
        | Component data event | `component` | `logstash` | `info` | `data` | `out` |
        | Input queue data event | `input-queue` | `logstash` | `info` | `data` | `in` |
        | Flow event | `flow` | `logstash` | `info` | `flow` | - |
        | Component error event | `component` | `logstash` | `error` | - | - |
        | System retry error event | `retry` | `system` | `error` | - | - |
      additionalProperties: true
      properties:
        _id:
          type: string
          description: Elasticsearch document ID.
        _index:
          type: string
          description: Elasticsearch index name.
        es_index:
          type: string
          description: Source index name.
        id:
          type: string
          description: Discriminator; observed values include `component`, `input-queue`, `flow`, `retry`.
        indexPrefix:
          type: string
          description: Discriminator; observed values include `logstash`, `system`.
        severity:
          type: string
          description: Severity; observed values include `info`, `error` (and `trace` with `trace=true`).
        type:
          type: string
          description: Record type; observed values include `data`, `flow`.
        tenantId:
          type: string
        flowId:
          type: string
        flowName:
          type: string
        flowType:
          type: string
          description: Observed value `automation`.
        userId:
          type: string
        componentId:
          type: string
        componentType:
          type: string
        bundleId:
          type: string
        correlationId:
          type: string
        messageId:
          type: string
        senderId:
          type: string
        senderType:
          type: string
        senderPort:
          type: string
        port:
          type: string
        portType:
          type: string
          enum:
            - in
            - out
        level:
          type: integer
        dataMessageType:
          type: string
          description: Observed value `componentLog`.
        testRunId:
          type: string
          description: Present only on records produced by a flow test run.
        staticCall:
          type: boolean
          description: "Present only on records produced by a static component call with `log: true`."
        msg:
          description: The message data (for data events).
        err:
          description: Error details (for error events).
        gridTimestamp:
          type: string
          format: date-time
        timestamp:
          type: string
          format: date-time
    LogHistogramBucket:
      type: object
      properties:
        key_as_string:
          type: string
          format: date-time
        key:
          type: integer
          description: Bucket start as a Unix timestamp in milliseconds.
        doc_count:
          type: integer
    LogSearchResult:
      type: object
      properties:
        hits:
          type: array
          items:
            $ref: "#/components/schemas/LogRecord"
        buckets:
          type: array
          description: Daily histogram of the matched records (`gridTimestamp`). Present when no custom aggregations were requested.
          items:
            $ref: "#/components/schemas/LogHistogramBucket"
        aggregations:
          type: object
          additionalProperties: true
          description: Results of custom aggregations (POST only); keyed by the aggregation names used in the request.
        size:
          type: integer
          description: The `size` query parameter echoed back.
        nextFrom:
          type: integer
          description: "`from` + `size`; the `from` value for the next page."
      required:
        - hits
    LogAggregationRequest:
      type: object
      properties:
        aggs:
          type: object
          additionalProperties: true
          description: Elasticsearch aggregations definition (https://elastic.co/guide/en/elasticsearch/reference/current/search-aggregations.html). `aggregations` is accepted as an alias.
        aggregations:
          type: object
          additionalProperties: true
          description: Alias of `aggs`.
    LogDetail:
      type: object
      description: Raw Elasticsearch document of a log.
      properties:
        _index:
          type: string
        _type:
          type: string
        _id:
          type: string
        _version:
          type: integer
        _source:
          $ref: "#/components/schemas/LogRecord"
    TelemetryCount:
      type: object
      properties:
        userId:
          type: string
        count:
          type: integer
    TelemetryUsage:
      type: object
      properties:
        messageCounts:
          type: object
          properties:
            from:
              type:
                - string
                - "null"
            to:
              type:
                - string
                - "null"
            count:
              type: integer
            userId:
              type: string
        runningFlows:
          $ref: "#/components/schemas/TelemetryCount"
        activeConnectors:
          $ref: "#/components/schemas/TelemetryCount"
        usedApps:
          type: array
          items:
            type: string
    TelemetryMessageStats:
      type: object
      properties:
        from:
          type:
            - string
            - "null"
        to:
          type:
            - string
            - "null"
        totalCount:
          type: integer
        totalSize:
          type: integer
          description: Total size of the messages in bytes.
        stats:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                description: Month in the `YYYY-MM` format.
              count:
                type: integer
              size:
                type: integer
    TelemetryFlowStats:
      type: object
      properties:
        totalCount:
          type: integer
        totalSize:
          type: integer
          description: Total size of the messages in bytes.
    UnprocessedMessage:
      type: object
      additionalProperties: true
      properties:
        messageId:
          type: string
        flowId:
          type: string
        componentId:
          type: string
        correlationId:
          type: string
        messages:
          type: object
          additionalProperties: true
          description: The original message(s), keyed by input port name.
        created:
          type: string
          format: date-time
        err:
          description: Stringified error object.
        target:
          type: string
        options:
          type: object
          additionalProperties: true
        errorWhileParsing:
          type: string
          description: Present (list only) if the stored message could not be parsed.
    AutomationHubSettings:
      type: object
      properties:
        id:
          type: string
          description: Hub ID (always `default`).
          example: default
        settings:
          $ref: "#/components/schemas/AutomationHubSettingsObject"
        createdAt:
          type:
            - string
            - "null"
          format: date-time
        updatedAt:
          type:
            - string
            - "null"
          format: date-time
    AutomationHubSettingsObject:
      type: object
      description: Settings object with a flexible schema; any properties are allowed.
      additionalProperties: true
      properties:
        sharing:
          type: object
          properties:
            allowedEmails:
              type: array
              description: Email addresses allowed to access the Hub via share link. Only visible to admin users.
              items:
                type: string
                format: email
    AutomationHubSettingsUpdate:
      type: object
      required:
        - settings
      properties:
        settings:
          $ref: "#/components/schemas/AutomationHubSettingsObject"
    AutomationHubEmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Email address to send the activation link to.
    AutomationHubActivationLinkResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
          description: Present when the link was sent by email.
        code:
          type: string
          description: Activation code (manual mode only).
        link:
          type: string
          format: uri
          description: Activation link (manual mode only).
        expiresIn:
          type: integer
          description: Link TTL in seconds (manual mode only).
    AutomationHubActivationResult:
      type: object
      properties:
        token:
          type: string
          description: "JWT access token with the `otp: true` flag."
        user:
          type: object
          properties:
            id:
              type: string
            email:
              type: string
            username:
              type: string
    AutomationHubShareError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    File:
      type: object
      description: File metadata (GridFS file document). The file content is not included.
      properties:
        fileId:
          type: string
          format: uuid
          description: The UUID of the file.
        filename:
          type: string
        length:
          type: integer
          description: File size in bytes.
        chunkSize:
          type: integer
          description: Storage chunk size in bytes.
        uploadDate:
          type: string
          format: date-time
        md5:
          type: string
        contentType:
          type: string
        metadata:
          type: object
          description: Additional file metadata.
          properties:
            userId:
              type: string
              description: ID of the owner of the file.
            archived:
              type: boolean
            vendor:
              type: string
              description: Set for custom component source files.
          additionalProperties: true
    FileCount:
      type: object
      properties:
        count:
          type: integer
      required:
        - count
    FileDeleteTicket:
      type: object
      properties:
        ticket:
          type: string
          format: uuid
          description: ID of the background deletion task.
      required:
        - ticket
    PublicFile:
      type: object
      properties:
        filename:
          type: string
      required:
        - filename
    PublicFileUpload:
      type: object
      properties:
        filename:
          type: string
          description: The name for the file.
        file:
          type: string
          format: binary
          description: The file to be uploaded.
      required:
        - filename
        - file
    PublicFileOk:
      type: object
      properties:
        ok:
          type: boolean
    DataStore:
      type: object
      properties:
        storeId:
          type: string
          description: Store ID.
        name:
          type: string
          description: Name of the store.
        default:
          type: boolean
          description: "`true` for the user's default store (returned by Get All Stores only)."
      required:
        - storeId
        - name
    DataStoreName:
      type: object
      properties:
        name:
          type: string
          description: Name of the store.
      required:
        - name
    DataStoreItem:
      type: object
      description: A key-value record in a store.
      properties:
        key:
          type: string
        value:
          description: The stored value (usually a string).
        storeId:
          type: string
        userId:
          type: string
        oldValue:
          description: Previous value, present on records that were updated.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    DataStoreItemRef:
      type: object
      properties:
        storeId:
          type: string
        key:
          type:
            - string
            - number
      required:
        - storeId
        - key
  responses:
    BadRequest:
      description: The request is invalid, for example it failed payload or query validation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: The access token is missing, invalid or expired.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The user does not have the permission (or scope) required for this operation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  parameters:
    FlowIdParam:
      name: flowId
      in: path
      required: true
      description: Flow ID (lowercased by the server).
      schema:
        type: string
      example: 9089f275-f5a5-4796-ba23-365412c5666e
    FlowVersionIdParam:
      name: versionId
      in: path
      required: true
      description: Version ID (UUID v4).
      schema:
        type: string
        format: uuid
      example: e1a7a2a4-9d5e-4c8f-a1c9-2f7f7f9b1a10
    FlowComponentIdParam:
      name: componentId
      in: path
      required: true
      description: ID of the component in the flow descriptor.
      schema:
        type: string
    FlowEnqueueOnlyParam:
      name: enqueueOnly
      in: query
      description: |
        If `true`, the response is returned as soon as the request is enqueued in the engine, without
        waiting for the component to process it. The response code is `202` in this case.
      schema:
        type: string
        enum:
          - "true"
          - "false"
        default: "false"
    FlowAutoConnectAccountsParam:
      name: autoConnectAccounts
      in: query
      description: |
        Connect the user's available account to every component that needs one, after the flow has
        been saved. `true`: assign an account only where exactly one is available. `preferred`: with
        several accounts available, reuse an account already connected to another component of the
        same flow, otherwise take the first one. Never fails the request.
      schema:
        type: string
        enum:
          - "true"
          - preferred
    AccountIdParam:
      name: accountId
      in: path
      required: true
      description: Account ID.
      schema:
        type: string
      example: 5a6e21f3b266224186ac7d03
    AccountComponentTypeParam:
      name: componentType
      in: path
      required: true
      description: |
        Component type, e.g. `appmixer.slack.list.SendChannelMessage`. A service (`appmixer.slack`) or
        module (`appmixer.google.spreadsheets`) is accepted as well.
      schema:
        type: string
      example: appmixer.slack.list.SendChannelMessage
    AccountAuthTicketParam:
      name: ticket
      in: path
      required: true
      description: Authentication session ticket from `POST /auth/ticket`.
      schema:
        type: string
      example: 58593f07c3ee4f239dc69ff7:1d2a90df-b192-4a47-aaff-5a80bab66de5
    AccountAuthComponentIdParam:
      name: componentId
      in: path
      required: true
      description: Component ID.
      schema:
        type: string
      example: e25dc901-f92a-46a2-8d29-2573d4ad65e5
    ServiceConfigServiceIdParam:
      name: serviceId
      in: path
      required: true
      description: The service ID in the form `vendor:service`, e.g. `appmixer:google`.
      schema:
        type: string
      example: appmixer:google
    ServiceConfigScopeParam:
      name: scope
      in: query
      required: false
      description: Target the configuration stored for this scope instead of the system-wide one.
      schema:
        type: string
    UserIdParam:
      name: userId
      in: path
      required: true
      description: User ID.
      schema:
        type: string
    UserGroupIdParam:
      name: groupId
      in: path
      required: true
      description: User group ID.
      schema:
        type: string
    AclTypeParam:
      name: type
      in: path
      required: true
      description: ACL type.
      schema:
        $ref: "#/components/schemas/AclType"
    UserListLimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of users to return.
      schema:
        type: integer
        default: 100
    UserListOffsetParam:
      name: offset
      in: query
      required: false
      description: Number of users to skip.
      schema:
        type: integer
    UserListSortParam:
      name: sort
      in: query
      required: false
      description: Sort by a field, `field:1` (ascending) or `field:-1` (descending), for example `created:-1`.
      schema:
        type: string
    UserListFilterParam:
      name: filter
      in: query
      required: false
      description: |
        Filter by field value, `field:value`, for example `scope:acme1`. Prefix the value with `!` to negate.
        Repeat the parameter to combine several filters.
      schema:
        type: string
    UserListProjectionParam:
      name: projection
      in: query
      required: false
      description: Comma-separated list of fields to include; prefix a field with `-` to exclude it, for example `-metadata`.
      schema:
        type: string
    UserListFromIdParam:
      name: fromId
      in: query
      required: false
      description: Return only users with an ID greater than this one (cursor pagination).
      schema:
        type: string
    UserListPatternParam:
      name: pattern
      in: query
      required: false
      description: Case-insensitive regular expression matched against the username and email.
      schema:
        type: string
    UserListUserIdsParam:
      name: userIds
      in: query
      required: false
      description: Comma-separated list of user IDs.
      schema:
        type: string
    UserListTypeParam:
      name: type
      in: query
      required: false
      description: |
        User type. `personal` (regular users), `group` (internal users that own User Group resources), or
        `all`. When omitted, group users are excluded.
      schema:
        type: string
        enum:
          - personal
          - group
          - all
    UserListGroupIdParam:
      name: groupId
      in: query
      required: false
      description: Return only active members of this user group.
      schema:
        type: string
    AppIgnoreACLQuery:
      name: ignoreACL
      in: query
      description: Admin only. When `true`, returns every item regardless of ACL. Non-admin users receive a `400` error.
      schema:
        type: boolean
    AppCompressIconsQuery:
      name: compressIcons
      in: query
      description: Default `true`. When `true`, the `icon` field is returned as a URL; set to `false` to return the original inline base64 icon.
      schema:
        type: boolean
        default: true
    CategoryIdParam:
      name: categoryId
      in: path
      required: true
      description: ID of the category.
      schema:
        type: string
      example: 5f8a7b2c3d4e5f6a7b8c9d0e
    LogPortTypeParam:
      name: portType
      in: query
      description: Filter only input (`in`) or output (`out`) messages. Can be repeated (`portType=in&portType=out`). Both by default.
      schema:
        oneOf:
          - type: string
            enum:
              - in
              - out
          - type: array
            items:
              type: string
              enum:
                - in
                - out
      style: form
      explode: true
    LogFlowIdParam:
      name: flowId
      in: query
      description: The flow ID to filter on. Can be repeated to filter on more flows. If not present, logs for all the user's flows (including flows shared with the user) are returned.
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      style: form
      explode: true
    LogExcludesParam:
      name: excludes
      in: query
      description: Comma-separated field names to exclude from the returned log objects.
      schema:
        type: string
      example: msg,err
    LogIncludesParam:
      name: includes
      in: query
      description: Comma-separated field names to include in the returned log objects (only these fields are returned).
      schema:
        type: string
    LogQueryParam:
      name: query
      in: query
      description: Query string in the Lucene query syntax (Elasticsearch `query_string`), e.g. `gridTimestamp:[2019-03-04 TO 2019-03-08]`.
      schema:
        type: string
      example: gridTimestamp:[2019-03-04 TO 2019-03-08]
    LogSortParam:
      name: sort
      in: query
      description: Sort the result by a field, optionally followed by `:desc` (or `:asc`). Can be repeated to use multiple sortings.
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
        default: gridTimestamp:asc
      style: form
      explode: true
      example: gridTimestamp:desc
    LogSizeParam:
      name: size
      in: query
      description: Maximum number of logs returned. Useful for pagination.
      schema:
        type: integer
        default: 50
    LogFromParam:
      name: from
      in: query
      description: Index of the first log returned. Useful for pagination.
      schema:
        type: integer
        default: 0
    LogSearchAfterParam:
      name: searchAfter
      in: query
      description: Cursor-based pagination, more efficient than `from` for deep pagination. Pass the sort value(s) and `_id` of the last document from the previous page. The number of `searchAfter` values must match the number of `sort` parameters.
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      style: form
      explode: true
    LogTestRunIdParam:
      name: testRunId
      in: query
      description: Return only records produced by the given flow test run(s). Can be repeated.
      schema:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      style: form
      explode: true
    LogUserIdParam:
      name: userId
      in: query
      description: Return only logs of the given user. Non-admin users can only pass their own user ID.
      schema:
        type: string
    LogTraceParam:
      name: trace
      in: query
      description: Include `trace` severity logs in addition to `info` and `error`.
      schema:
        type: boolean
        default: false
    LogExcludePluginLogsParam:
      name: excludePluginLogs
      in: query
      description: Exclude logs generated by plugins.
      schema:
        type: boolean
        default: false
    UnprocessedMessageIdParam:
      name: messageId
      in: path
      required: true
      description: The message ID (`messageId` UUID; the internal `_id` is also accepted for backwards compatibility).
      schema:
        type: string
      example: a9b78d3c-ec9a-4c0e-81c2-b1df12bd46d7
    FileIdParam:
      name: fileId
      in: path
      required: true
      description: The UUID of the file.
      schema:
        type: string
        format: uuid
    FileLimitParam:
      name: limit
      in: query
      required: false
      description: Maximum number of files returned.
      schema:
        type: integer
        default: 100
    FileOffsetParam:
      name: offset
      in: query
      required: false
      description: Number of files to skip.
      schema:
        type: integer
    FileSortParam:
      name: sort
      in: query
      required: false
      description: Property to sort by followed by `:` and `1` (ascending) or `-1` (descending), e.g. `filename:1`.
      schema:
        type: string
    FileProjectionParam:
      name: projection
      in: query
      required: false
      description: Comma-separated list of properties to include; prefix a property with `-` to exclude it.
      schema:
        type: string
    FileFilterParam:
      name: filter
      in: query
      required: false
      description: |
        Filter in the form `property:value`, e.g. `filename:~invoice` (`~` means "contains"). Can be
        repeated.
      schema:
        type: string
    FileIncludeComponentSourceFilesParam:
      name: includeComponentSourceFiles
      in: query
      required: false
      description: |
        By default, only files (that are used in flows) are returned. Custom component source codes are
        stored as files as well; set this to include them. Note that any non-empty value (even `false`)
        enables it.
      schema:
        type: boolean
    DataStoreIdParam:
      name: storeId
      in: path
      required: true
      description: Store ID.
      schema:
        type: string
    DataStorePatternParam:
      name: pattern
      in: query
      required: false
      description: |
        Optional search pattern (regular expression). Only records whose key or value matches the pattern
        are included.
      schema:
        type: string
    DataStoreEscapePatternParam:
      name: escapePattern
      in: query
      required: false
      description: |
        Set to `true` to treat `pattern` as a literal string instead of a regular expression. Any other
        value leaves the pattern interpreted as a regular expression.
      schema:
        type: string
tags:
  - name: Authentication
    description: "Sign in to get an access token, create (sign up) a user and get the current user. Pass the token to other endpoints in the `Authorization: Bearer <token>` header."
  - name: Automation Hub
    description: |
      Automation Hub configuration and shareable link management. Settings configure the hub's
      appearance, behavior and access controls (admin only). Shareable links enable public access
      to the Automation Hub marketplace via email-based authentication with one-time activation links.
  - name: Flows
    description: |
      Create, read, update, delete, clone, start and stop flows; manage flow drafts and flow
      versions; validate and test flows; and send HTTP requests (webhooks) to flow components.
  - name: Apps
    description: Control the connectors (apps, components, bundles) that are installed in your Appmixer tenant. You can also publish new and uninstall existing connectors, and call components statically.
  - name: Accounts
    description: |
      Accounts are the credentials (OAuth tokens, API keys, username/password pairs) that a user
      authenticated with to connector apps. Components in flows use accounts to call third-party APIs. This group also contains the endpoints that drive authenticating a user to a connector app (authentication tickets, URLs and status) and assign accounts to components; the Appmixer JS SDK normally handles those for you.
  - name: User
    description: Sign in, create and manage users, and change or reset passwords.
  - name: User Groups
    description: |
      User Groups (also known as Workspaces) let teams collaborate by sharing resources such as flows,
      data stores and files. Group resources are owned by the group rather than by individual users,
      while audit logs keep track of the individual user actions. Admin users are automatically added
      to the default admin group. Users can switch between their personal context and a group context;
      the access token then carries the group information.
  - name: Insights
    description: |
      Get the list of all messages passing through your flows (logs) and usage information (telemetry).

      Logs contain data messages getting into a component's input port(s) and messages sent to a
      component's output port(s), as well as errors that occurred during a flow run or while
      starting/stopping a flow. Log records come in several variants (component data event, input
      queue data event, flow event, component error event, system retry error event); see the
      `LogRecord` schema.
  - name: Files
    description: Appmixer allows you to upload files to use them in your flows.
  - name: Data Stores
    description: Access Data Stores (built-in key-value store).
  - name: Connector Configuration
    description: |
      Global configuration for your connectors. Values stored for a service are injected into the
      `context.config` object (alias `context.auth`) of every component of that service, and into the
      `context` of its auth module. Only users with the `admin` scope can use these endpoints.
  - name: ACL
    description: |
      ACLs control access to connectors (components) by users or groups of users, and access to any other
      Appmixer functionality by limiting the API routes users can use (API/UI).
  - name: Config
    description: System configuration stored in the database. These endpoints are only accessible to users with the `admin` scope.
  - name: Audit Logs
    description: |
      The audit log records who changed what in your Appmixer tenant, and when. Failed attempts are
      recorded too. Only users with the `admin` scope can read it.

      **Attribution to your own users.** If your application works through one Appmixer user for many
      people, send an opaque ID of the person who makes a change in the `X-Appmixer-Audit-External-User-Id`
      header of the request that makes it (available since Appmixer 6.5.6). The value must be 1 to 128
      characters long and use only letters, digits, `.`, `_` and `-`; a value in any other format is
      ignored and the request still succeeds. It is stored as `externalUserId` on the audit log entry and
      can be filtered on. Requests that do not write an audit log entry ignore the header.

      Never send names, email addresses or other personal data: the value is stored exactly as sent,
      returned by the API and exported in the CSV until the entry expires, and entries cannot be deleted
      earlier. The header is attribution, not authentication: Appmixer does not verify it. From browser
      code, send the header only to Appmixer 6.5.6 or later: older versions refuse it in the CORS
      preflight, so the browser blocks the whole request. Server-side requests are not affected.
  - name: Modifiers
    description: Modifiers are data transformation functions that can be used to transform data variables inside your flows. You can customize the list of modifiers or even define your own functions.
  - name: Public Files
    description: |
      Public files are files that are available at the root location of your Appmixer tenant API
      endpoint. For example, uploading `verify.html` makes the file available at `API_URL/verify.html`.
      All Public Files endpoints require the `admin` scope.
  - name: Unprocessed Messages
    description: |
      When a message processing fails, even after a certain number of retries, Appmixer stops
      processing the message and archives it. You can fetch, delete, and even retry those messages
      programmatically.
  - name: Variables
    description: |
      Variables are placeholders that can be used in component config or inputs. They are replaced
      either at runtime by data coming from components connected back in the chain (dynamic
      variables) or by real values (static variables).
  - name: Integration Categories
    description: Categories organize integration templates in the Automation Hub marketplace. Categories are global resources; all authenticated users can read them, only admins can create, update or delete them. Categories are assigned to integration templates and drafts through the Flows API (`categories` array).
paths:
  /user/auth:
    post:
      tags:
        - Authentication
      summary: Sign-in User
      operationId: signInUser
      description: |
        Sign in a user with credentials and get their access token. Provide either `username` or `email`
        together with `password`.

        This endpoint is public by default. If the `API_USER_AUTH_SCOPE` system configuration is set, a
        token with one of the listed scopes is required.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Username and password
                  additionalProperties: false
                  required:
                    - username
                    - password
                  properties:
                    username:
                      type: string
                      description: Username (usually the email address).
                    password:
                      type: string
                      description: Password.
                - type: object
                  title: Email and password
                  additionalProperties: false
                  required:
                    - email
                    - password
                  properties:
                    email:
                      type: string
                      format: email
                      description: Email address.
                    password:
                      type: string
                      description: Password.
            example:
              username: abc@example.com
              password: abc321
      responses:
        "200":
          description: The user signed in. Returns the user and an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
              example:
                user:
                  id: 5c88c7cc04a917256c726c3d
                  username: abc@example.com
                  isActive: false
                  email: abc@example.com
                  plan: free
                  metadata: {}
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjVjODhjN2NjMDRhOTE3MjU2YzcyNmMzZCIsInNjb3BlIjpbInVzZXIiXSwiaWF0IjoxNTUyNDkyNjA5LCJleHAiOjE1NTUwODQ2MDl9.9jVcqY0qo9Q_1GeK9Fg14v7OrdpWvzmqnv4jDMZfqnI
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          $ref: "#/components/responses/Forbidden"
  /user:
    post:
      tags:
        - Authentication
      summary: Create User
      operationId: createUser
      description: |
        Create a user. By default, this endpoint is open (does not require authentication). This can be
        changed with the `API_USER_CREATE_SCOPE` system configuration: if you set it to, for example,
        `admin`, an admin token is required to call this endpoint.

        Setting `aiContext` always requires an **admin token**, even though this endpoint is otherwise open
        by default. Copilot splices the value into its system prompt, so allowing a self-service signup to
        set it would be a prompt-injection vector. A request that sets `aiContext` without the `admin` scope
        is rejected with `403 Setting aiContext requires the admin scope.` Reading the field back is
        unrestricted.

        Unauthenticated signups are rate limited per email address and per IP address.
      security:
        - {}
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
            example:
              username: abc@example.com
              email: abc@example.com
              password: abc321abc321
      responses:
        "201":
          description: The user was created. Returns the user and an access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjVjODhjN2NjMDRhOTE3MjU2YzcyNmMzZCIsInNjb3BlIjpbInVzZXIiXSwiaWF0IjoxNTUyNDkyNjA5LCJleHAiOjE1NTUwODQ2MDl9.9jVcqY0qo9Q_1GeK9Fg14v7OrdpWvzmqnv4jDMZfqnI
                user:
                  id: 5c88c7cc04a917256c726c3d
                  username: abc@example.com
                  isActive: true
                  email: abc@example.com
                  scope:
                    - user
                  metadata: {}
                  aiContext: null
                  plan: beta
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          description: Too many signup attempts for this email address or from this IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    get:
      tags:
        - Authentication
      summary: Get Current User Information
      operationId: getCurrentUser
      description: Get information about the user the access token belongs to.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserDetail"
              example:
                id: 58593f07c3ee4f239dc69ff7
                username: tomas@client.io
                isActive: true
                email: tomas@client.io
                scope:
                  - user
                metadata: {}
                aiContext: "Timezone: Europe/Prague."
                plan: beta
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /automation-hub/settings:
    get:
      tags:
        - Automation Hub
      summary: Get Settings
      operationId: getAutomationHubSettings
      description: |
        Retrieve the current Automation Hub settings. All authenticated users can read settings, but
        sensitive fields (`settings.sharing.allowedEmails`) are only returned to admin users.

        If no settings exist, default empty settings are returned (`settings: {}`, `createdAt` and
        `updatedAt` set to `null`).
      responses:
        "200":
          description: The Automation Hub settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubSettings"
              examples:
                settingsFound:
                  summary: Settings found
                  value:
                    id: default
                    settings:
                      sharing:
                        allowedEmails:
                          - user@example.com
                          - team@company.com
                      theme:
                        primaryColor: "#007bff"
                        logoUrl: https://example.com/logo.png
                      customField: any-value
                    createdAt: 2026-01-15T10:30:00.000Z
                    updatedAt: 2026-04-20T14:45:00.000Z
                noSettings:
                  summary: No settings
                  value:
                    id: default
                    settings: {}
                    createdAt: null
                    updatedAt: null
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Automation Hub
      summary: Update Settings
      operationId: updateAutomationHubSettings
      description: |
        Create or update Automation Hub settings. This endpoint performs an upsert operation: the
        whole `settings` object is replaced. Requires the `admin` scope.

        The `settings` object supports any properties, allowing you to add custom fields without
        backend changes. Only `settings.sharing.allowedEmails` is validated (must be an array of
        valid email addresses).

        The operation is recorded in the audit logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationHubSettingsUpdate"
            example:
              settings:
                sharing:
                  allowedEmails:
                    - user@example.com
                    - team@company.com
                theme:
                  primaryColor: "#007bff"
      responses:
        "200":
          description: The updated settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubSettings"
              example:
                id: default
                settings:
                  sharing:
                    allowedEmails:
                      - user@example.com
                      - team@company.com
                  theme:
                    primaryColor: "#007bff"
                createdAt: 2026-01-15T10:30:00.000Z
                updatedAt: 2026-04-22T09:15:00.000Z
        "400":
          description: The request is invalid, for example it failed payload validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 400
                error: Bad Request
                message: '"settings.sharing.allowedEmails[0]" must be a valid email'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Automation Hub
      summary: Delete Settings
      operationId: deleteAutomationHubSettings
      description: |
        Delete all Automation Hub settings and reset to defaults. Requires the `admin` scope.
        The operation is recorded in the audit logs.
      responses:
        "204":
          description: Settings successfully deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /automation-hub/share/request-login:
    post:
      tags:
        - Automation Hub
      summary: Request Login
      operationId: requestAutomationHubLogin
      security: []
      description: |
        Request an activation link for email-based login to the Automation Hub. No authentication
        required. The email must be on the allow list configured in the hub settings
        (`settings.sharing.allowedEmails`, case-insensitive).

        If automatic email sending is enabled (`AUTOMATION_HUB_AUTO_SEND_EMAIL`, default `true`),
        the activation link is sent by email (via SMTP if `SMTP_HOST` is configured, otherwise via
        the Cloud Email API). Otherwise, the code and link are returned directly in the response.

        Rate limited by email (`AUTOMATION_HUB_RATE_LIMIT_REQUEST_LOGIN_EMAIL`, default 5 requests
        per minute) and IP address (`AUTOMATION_HUB_RATE_LIMIT_REQUEST_LOGIN_IP`, default 20
        requests per minute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationHubEmailRequest"
            example:
              email: user@example.com
      responses:
        "200":
          description: |
            The activation link was sent by email (auto-send enabled), or the code and link are returned
            directly (manual mode, `AUTOMATION_HUB_AUTO_SEND_EMAIL` disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubActivationLinkResult"
              examples:
                autoSend:
                  summary: Auto-send enabled
                  value:
                    success: true
                    message: Activation link sent to your email
                manual:
                  summary: Manual mode
                  value:
                    success: true
                    code: a1b2c3d4e5f6
                    link: https://your-hub.com/automation-hub/share/activate?code=a1b2c3d4e5f6
                    expiresIn: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The email is not on the allow list configured in the hub settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Email not authorized. Please contact your administrator.
        "429":
          description: Rate limit exceeded. Separate limits apply per email and per IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 429
                error: Too Many Requests
                message: Too many requests for this email address. Please try again in a few minutes.
        "500":
          description: Email sending failed (SMTP or Cloud Email API error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Failed to send activation email. Please try again.
  /automation-hub/share/activate:
    get:
      tags:
        - Automation Hub
      summary: Activate Link
      operationId: activateAutomationHubLink
      security: []
      description: |
        Activate the link, create or find the virtual user, and return a JWT token. No
        authentication required. Each activation link can only be used once and expires after
        `AUTOMATION_HUB_ACTIVATION_LINK_TTL` seconds (default 3600).

        The returned JWT token includes an `otp: true` flag and can be used for authentication.
        Virtual users are created automatically on first activation, with username and email set
        to the activation email address, and can access only the Automation Hub marketplace.

        Rate limited by IP address (`AUTOMATION_HUB_RATE_LIMIT_ACTIVATE_IP`, default 10 requests per
        minute).
      parameters:
        - name: code
          in: query
          required: true
          description: Activation code from the email link.
          schema:
            type: string
          example: a1b2c3d4e5f6
      responses:
        "200":
          description: The link was activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubActivationResult"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 507f1f77bcf86cd799439011
                  email: user@example.com
                  username: user@example.com
        "400":
          description: The activation link has already been used, or the `code` parameter is missing.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/AutomationHubShareError"
                  - $ref: "#/components/schemas/Error"
              example:
                error: Activation link has already been used
        "404":
          description: The activation code is invalid or the link has expired.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Invalid or expired activation link
        "429":
          description: Rate limit exceeded for the IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 429
                error: Too Many Requests
                message: Too many activation attempts. Please try again in a few minutes.
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Internal server error
  /automation-hub/share/refresh:
    post:
      tags:
        - Automation Hub
      summary: Refresh Link
      operationId: refreshAutomationHubLink
      security: []
      description: |
        Request a new activation link for users with expired tokens. Works exactly like
        `POST /automation-hub/share/request-login` (same allow list validation and responses) but is
        intended for users who already have an expired session. No authentication required.

        Rate limited by email (`AUTOMATION_HUB_RATE_LIMIT_REFRESH_EMAIL`, default 5 requests per
        minute) and IP address (`AUTOMATION_HUB_RATE_LIMIT_REFRESH_IP`, default 20 requests per
        minute).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationHubEmailRequest"
            example:
              email: user@example.com
      responses:
        "200":
          description: |
            The activation link was sent by email (auto-send enabled), or the code and link are returned
            directly (manual mode, `AUTOMATION_HUB_AUTO_SEND_EMAIL` disabled).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubActivationLinkResult"
              examples:
                autoSend:
                  summary: Auto-send enabled
                  value:
                    success: true
                    message: Activation link sent to your email
                manual:
                  summary: Manual mode
                  value:
                    success: true
                    code: a1b2c3d4e5f6
                    link: https://your-hub.com/automation-hub/share/activate?code=a1b2c3d4e5f6
                    expiresIn: 3600
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          description: The email is not on the allow list configured in the hub settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Email not authorized. Please contact your administrator.
        "429":
          description: Rate limit exceeded. Separate limits apply per email and per IP address.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 429
                error: Too Many Requests
                message: Too many requests for this email address. Please try again in a few minutes.
        "500":
          description: Email sending failed (SMTP or Cloud Email API error).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationHubShareError"
              example:
                error: Failed to send activation email. Please try again.
  /flows:
    get:
      tags:
        - Flows
      summary: Get Flows
      operationId: getFlows
      description: |
        Return all flows of a user (the user's own flows plus flows shared with the user). Users with
        the `admin` scope (that are not group users) see flows of all users.

        To list all published Integration Templates use
        `GET /flows?filter=templateId:!&filter=wizard.fields`; to list a user's integration instances
        use `GET /flows?filter=templateId`.
      parameters:
        - name: filter
          in: query
          description: |
            Filter flows by their property values, in the form `property:value`. Example: `userId:123abc`
            returns only flows whose owner is the user with ID `123abc` (i.e. shared flows are excluded).
            Nested fields can be used too, which is especially useful with the `customFields` metadata
            object, e.g. `customFields.category:healthcare`. Prefix the value with `!` to negate. The
            parameter can be repeated to combine several filters.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
          example: customFields.category:healthcare
        - name: sharedWithPermissions
          in: query
          description: |
            Filter shared flows by their sharing permissions, comma separated. Possible permissions are
            `read`, `start` and `stop`.
          schema:
            type: string
          example: read,start
        - name: projection
          in: query
          description: Comma separated list of flow properties to include, or to exclude when prefixed with `-`.
          schema:
            type: string
          example: -flow,-thumbnail
        - name: sort
          in: query
          description: |
            Sorting parameter. Any flow property followed by a colon and `1` (ascending) or `-1`
            (descending).
          schema:
            type: string
          example: mtime:-1
        - name: pattern
          in: query
          description: A term to filter flows containing the pattern in their `name` or `flowId` property (case-insensitive).
          schema:
            type: string
        - name: offset
          in: query
          description: The index of the first item returned. Useful for paging.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          description: Maximum number of items returned. Useful for paging.
          schema:
            type: integer
            default: 100
        - name: fromId
          in: query
          description: Internal `_id` of the flow after which the page starts (the flow itself is excluded).
          schema:
            type: string
        - name: published
          in: query
          description: |
            Only applied together with `filter=type:integration-draft`. `true` returns only drafts whose
            Integration Template is published (shared), `false` only drafts without a published template.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: escapePattern
          in: query
          description: Accepted for backwards compatibility; the pattern is always escaped.
          deprecated: true
          schema:
            type: string
      responses:
        "200":
          description: Flows successfully retrieved.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Flow"
              example:
                - userId: 58593f07c3ee4f239dc69ff7
                  flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                  stage: stopped
                  name: "Flow #4"
                  btime: 2018-03-29T19:24:08.950Z
                  mtime: 2018-04-05T12:50:15.952Z
                  sharedWith:
                    - email: david@client.io
                      permissions:
                        - read
                        - start
                        - stop
                  flow:
                    e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                      type: appmixer.utils.http.Uptime
                      label: Uptime
                      source: {}
                      x: 110
                      y: 90
                      config: {}
                    43f1f63a-ecd2-42dc-a618-8c96b4acc767:
                      type: appmixer.utils.email.SendEmail
                      label: SendEmail
                      source:
                        in:
                          e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                            - up
                      x: 320
                      y: -10
                      config:
                        transform:
                          in:
                            e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                              up:
                                type: json2new
                                lambda:
                                  from_email: info@appmixer.com
                                  subject: "Appmixer: Site UP ({{{$.e15ef119-8fcb-459b-aaae-2a3f9ee41f15.up.target}}})"
                                  text: Site {{{$.e15ef119-8fcb-459b-aaae-2a3f9ee41f15.up.target}}} is back UP.
                  mode: module
                  thumbnail: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22...
                  started: 2018-04-05T12:33:15.357Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Flows
      summary: Create Flow
      operationId: createFlow
      description: |
        Create a new flow. The `flow` descriptor is required (an empty object `{}` is a valid blank
        canvas).

        **Automatic account connection.** Pass `?autoConnectAccounts=true` to connect the user's
        available account to every component that needs one, after the flow has been saved. With
        `preferred`, when several accounts are available, an account already connected to another
        component of the same flow is reused; otherwise the first one is taken deterministically.
        Account assignment runs after the flow is persisted and never fails the request.

        The request is rejected when the user's storage quota or flow limits (number of flows,
        components per flow) are exceeded.
      parameters:
        - $ref: "#/components/parameters/FlowAutoConnectAccountsParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowCreatePayload"
            example:
              name: "My Flow #1"
              flow: {}
              customFields:
                category: healthcare
      responses:
        "201":
          description: Flow successfully created.
          headers:
            Location:
              description: URL path of the new flow (`/flows/{flowId}`).
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  flowId:
                    type: string
                  categories:
                    type:
                      - array
                      - "null"
                    items:
                      type: string
                required:
                  - flowId
              example:
                flowId: 26544d8c-5209-44ac-9bdf-ef786924b07b
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /flows/count:
    get:
      tags:
        - Flows
      summary: Get Flows Count
      operationId: getFlowsCount
      description: Return the number of all flows of a user. Accepts the same filtering parameters as Get Flows.
      parameters:
        - name: filter
          in: query
          description: Filter flows by their property values (`property:value`). Can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: pattern
          in: query
          description: A term to filter flows containing the pattern in their `name` or `flowId` property.
          schema:
            type: string
        - name: sharedWithPermissions
          in: query
          description: Filter shared flows by their sharing permissions, comma separated (`read`, `start`, `stop`).
          schema:
            type: string
        - name: published
          in: query
          description: Only applied together with `filter=type:integration-draft`; see Get Flows.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: escapePattern
          in: query
          description: Accepted for backwards compatibility; the pattern is always escaped.
          deprecated: true
          schema:
            type: string
      responses:
        "200":
          description: Number of flows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count
              example:
                count: 29
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /flows/{flowId}:
    parameters:
      - $ref: "#/components/parameters/FlowIdParam"
    get:
      tags:
        - Flows
      summary: Get Flow
      operationId: getFlow
      description: |
        Return one flow. For a running flow the response also contains `runtimeErrors` (up to 100
        error log records since the flow was started). For a draft the response contains
        `draft.hasChanges`, telling whether publishing the draft would change the original flow.
      parameters:
        - name: projection
          in: query
          description: Comma separated list of flow properties to include, or to exclude when prefixed with `-`.
          schema:
            type: string
          example: -thumbnail
      responses:
        "200":
          description: Flow successfully retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Flow"
              example:
                userId: 58593f07c3ee4f239dc69ff7
                flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                stage: stopped
                name: "Flow #4"
                btime: 2018-03-29T19:24:08.950Z
                mtime: 2018-04-05T12:50:15.952Z
                flow:
                  e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                    type: appmixer.utils.http.Uptime
                    label: Uptime
                    source: {}
                    x: 110
                    y: 90
                    config: {}
                  416150af-b0d4-4d06-8ad1-75b17e578532:
                    type: appmixer.utils.email.SendEmail
                    label: SendEmail
                    source:
                      in:
                        e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                          - down
                    x: 320
                    y: 195
                    config:
                      transform:
                        in:
                          e15ef119-8fcb-459b-aaae-2a3f9ee41f15:
                            down:
                              type: json2new
                              lambda:
                                from_email: info@appmixer.com
                                subject: "Appmixer: Site DOWN ({{{$.e15ef119-8fcb-459b-aaae-2a3f9ee41f15.down.target}}})"
                                text: Site {{{$.e15ef119-8fcb-459b-aaae-2a3f9ee41f15.down.target}}} is DOWN.
                mode: module
                thumbnail: data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22...
                started: 2018-04-05T12:33:15.357Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Flows
      summary: Update Flow
      operationId: updateFlow
      description: |
        Update an existing flow. This is a partial update: send only the properties you want to
        change (`flow`, `name`, `customFields`, `thumbnail`, `sharedWith`, `wizard`, `notes`, ...).
        `flow` is the flow descriptor.

        A running flow cannot be updated unless `forceUpdate=true`.

        This route is an upsert: if no flow with the given ID exists, a new flow is created (then the
        payload must include the `flow` descriptor, as for Create Flow) and `201` is returned.

        Supports `?autoConnectAccounts=true|preferred` (see Create Flow).
      parameters:
        - name: forceUpdate
          in: query
          description: A running flow cannot be updated unless `forceUpdate=true`.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: validate
          in: query
          description: Validate the new flow descriptor when updating a running flow. Default `true`.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: inProgressData
          in: query
          description: When `delete`, in-progress data of a running flow is deleted during the update.
          schema:
            type: string
            enum:
              - delete
        - $ref: "#/components/parameters/FlowAutoConnectAccountsParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowPayload"
            example:
              name: "My Flow #2"
      responses:
        "200":
          description: Flow updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowUpdateResult"
              example:
                flowId: 26544d8c-5209-44ac-9bdf-ef786924b07b
                result: updated
        "201":
          description: Flow did not exist and was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowUpdateResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Flows
      summary: Delete Flow
      operationId: deleteFlow
      description: Delete an existing flow. Versions of the flow are deleted too.
      responses:
        "200":
          description: Flow deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flowId:
                    type: string
                required:
                  - flowId
              example:
                flowId: 26544d8c-5209-44ac-9bdf-ef786924b07b
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /flows/{flowId}/clone:
    parameters:
      - $ref: "#/components/parameters/FlowIdParam"
    post:
      tags:
        - Flows
      summary: Clone Flow
      operationId: cloneFlow
      description: |
        Clone a flow. Requires read permission on the source flow.

        **Create a draft.** Flow Drafts are editable copies of a flow that don't affect the original
        (running) flow; they are primarily used to change integration instances while the original
        keeps running. To create a draft, clone the flow with `setOriginFlowId: true`,
        `setComponentIdMap: true`, `connectAccounts: true` (recommended) and `additional.type` set to
        `automation-draft` or `integration-instance-draft`. Only one draft per flow can exist: if an
        up-to-date draft already exists, its ID is returned instead of creating a duplicate (an
        outdated draft is replaced). Publish the draft with `POST /drafts/{flowId}/publish`.

        Supports `autoConnectAccounts` (in the body or as a query parameter, see Create Flow).
      parameters:
        - $ref: "#/components/parameters/FlowAutoConnectAccountsParam"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FlowClonePayload"
            examples:
              clone:
                summary: Clone a flow
                value:
                  prefix: "Copy of "
                  connectAccounts: true
              draft:
                summary: Create a draft
                value:
                  setOriginFlowId: true
                  setComponentIdMap: true
                  connectAccounts: true
                  additional:
                    type: integration-instance-draft
      responses:
        "201":
          description: Flow cloned (or the existing draft returned).
          headers:
            Location:
              description: URL path of the clone (`/flows/{cloneId}`).
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowCloneResult"
              example:
                cloneId: cloned-flow-id
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /drafts/{flowId}/publish:
    parameters:
      - name: flowId
        in: path
        required: true
        description: ID of the draft flow to publish.
        schema:
          type: string
    post:
      tags:
        - Flows
      summary: Publish a Draft
      operationId: publishFlowDraft
      description: |
        Publish a draft to update the original flow with the draft's changes. Only the owner of the
        draft can publish it. Publishing:

        1. snapshots the original flow as a `publish` version,
        2. maps the draft component IDs back to the original flow's component IDs,
        3. updates the original flow with the draft's configuration (if the original flow is running,
           the changes take effect immediately),
        4. moves account connections to the original flow, and
        5. deletes the draft.
      parameters:
        - name: forceUpdate
          in: query
          description: Required as `true` to update a running original flow in some situations (same as Update Flow).
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: validate
          in: query
          description: Validate the flow when updating a running original flow. Default `true`.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: inProgressData
          in: query
          description: When `delete`, in-progress data of the running original flow is deleted.
          schema:
            type: string
            enum:
              - delete
      responses:
        "200":
          description: Draft published successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  flowId:
                    type: string
                    description: ID of the original flow.
                  draftId:
                    type: string
                    description: ID of the (now deleted) draft.
                  result:
                    $ref: "#/components/schemas/FlowUpdateResult"
                required:
                  - flowId
                  - draftId
              example:
                flowId: original-flow-id
                draftId: draft-flow-id
                result:
                  flowId: original-flow-id
                  result: updated
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: User does not own the draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 403
                error: Forbidden
                message: You do not have permission to publish this draft.
        "404":
          description: Draft or its origin flow not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /flows/{flowId}/versions:
    parameters:
      - $ref: "#/components/parameters/FlowIdParam"
    post:
      tags:
        - Flows
      summary: Create Version
      operationId: createFlowVersion
      description: |
        Create a new version snapshot of the current state of the flow. A version stores the flow
        descriptor together with the flow's `name`, `customFields`, `wizard` and `notes`.

        Version types: `manual` (created explicitly by the user), `autosave` (created automatically
        while editing), `publish` (created when a draft is published) and `restore-point` (created
        before a restore). Only `manual` and `autosave` can be created via the API. Old `autosave`
        and `restore-point` versions are garbage-collected automatically.

        Allowed for the flow owner and for users with the `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum:
                    - manual
                    - autosave
                  description: Version type.
                label:
                  type: string
                  maxLength: 255
                  description: Optional human readable label.
              required:
                - type
            example:
              type: manual
              label: Before big refactoring
      responses:
        "200":
          description: Version created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  versionId:
                    type: string
                    format: uuid
                  versionNumber:
                    type: integer
                required:
                  - versionId
                  - versionNumber
              example:
                versionId: e1a7a2a4-9d5e-4c8f-a1c9-2f7f7f9b1a10
                versionNumber: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags:
        - Flows
      summary: List Versions
      operationId: getFlowVersions
      description: Return the versions of a flow (metadata only, without the flow descriptors).
      parameters:
        - name: type
          in: query
          description: Filter by version type.
          schema:
            $ref: "#/components/schemas/FlowVersionType"
        - name: limit
          in: query
          description: Maximum number of items returned.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          description: The index of the first item returned. Useful for paging.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Versions successfully retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/FlowVersion"
                  totalCount:
                    type: integer
                required:
                  - items
                  - totalCount
              example:
                items:
                  - versionId: e1a7a2a4-9d5e-4c8f-a1c9-2f7f7f9b1a10
                    flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                    versionNumber: 4
                    type: manual
                    label: Before big refactoring
                    name: My Flow
                    btime: 2026-07-01T09:12:33.001Z
                totalCount: 4
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /flows/{flowId}/versions/{versionId}:
    parameters:
      - $ref: "#/components/parameters/FlowIdParam"
      - $ref: "#/components/parameters/FlowVersionIdParam"
    get:
      tags:
        - Flows
      summary: Get Version
      operationId: getFlowVersion
      description: Return a single version including its stored flow descriptor, notes, custom fields and wizard.
      responses:
        "200":
          description: Version retrieved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FlowVersion"
        "400":
