  /resources/transfer:
    put:
      tags:
        - User Groups
      summary: Transfer Resources
      operationId: transferResources
      description: |
        Transfer **all resources** (flows, accounts, access tokens, flow versions, data stores, files,
        telemetry, ...) from a user or group to another user or group. Admin token required (`admin` scope).
        Provide exactly one of `sourceUserId`/`sourceGroupId` and exactly one of `targetUserId`/`targetGroupId`.

        Typical use cases: an employee leaving (transfer their resources to a group or a colleague), or
        consolidating group ownership.

        The transfer runs as a background task; the endpoint returns `202 Accepted` with a `ticket`. The source
        user is blocked (`metadata.blocked`) before the transfer starts to prevent API access during the
        migration; requesting a transfer for an already-blocked source returns `409 Conflict`. Running flows
        keep running during and after the transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sourceUserId:
                  type: string
                  description: User to transfer resources from.
                sourceGroupId:
                  type: string
                  description: Group to transfer resources from.
                targetUserId:
                  type: string
                  description: User to transfer resources to.
                targetGroupId:
                  type: string
                  description: Group to transfer resources to.
              allOf:
                - oneOf:
                    - required:
                        - sourceUserId
                    - required:
                        - sourceGroupId
                - oneOf:
                    - required:
                        - targetUserId
                    - required:
                        - targetGroupId
            example:
              sourceUserId: 5f8a7b2c3d4e5f6a7b8c9d0e
              targetGroupId: 64b0a1c2d3e4f5a6b7c8d9e0
      responses:
        "202":
          description: The transfer started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTaskTicket"
              example:
                ticket: 2e9dd726-2b7f-46f7-bea4-8db7f7175aa8
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A transfer for this source is already in progress or has been completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 409
                error: Conflict
                message: A transfer for this source is already in progress or has been completed
  /auth/switch-context:
    post:
      tags:
        - User Groups
      summary: Switch Context
      operationId: switchUserContext
      description: |
        Switch the user context between the personal workspace and a group workspace. Returns a new access
        token for the selected context.

        When operating in a group context, the token contains `id` (the group user ID; resources are owned
        by this ID), `originalUserId` (the actual user ID, used for audit logging) and `groups`.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type:
                    - string
                    - "null"
                  description: ID of the group to switch to. Send `null` or omit it to switch to the personal context.
            example:
              groupId: 5f8a7b2c3d4e5f6a7b8c9d0e
      responses:
        "200":
          description: New access token for the selected context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserContextSwitchResponse"
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: 5f8a7b2c3d4e5f6a7b8c9d01
                  contextType: group
                  originalUserId: 5f8a7b2c3d4e5f6a7b8c9a01
                  groupId: 5f8a7b2c3d4e5f6a7b8c9d0e
                  groupName: Marketing Team
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The user is not a member of the group.
          content:
