        - ACL
      summary: Get ACL rules for components|routes
      operationId: getAclRules
      description: Get the list of all ACL rules for the given type. Admin token required (`admin` scope).
      responses:
        "200":
          description: ACL rules. The example shows the default rules for components (all users can access all non-private components).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AclRule"
              example:
                - role: admin
                  resource: "*"
                  action:
                    - "*"
                  attributes:
                    - non-private
                - role: user
                  resource: "*"
                  action:
                    - "*"
                  attributes:
                    - non-private
                - role: tester
                  resource: "*"
                  action:
                    - "*"
                  attributes:
                    - non-private
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/AclTypeParam"
    post:
      tags:
        - ACL
      summary: Update ACL rules
      operationId: updateAclRules
      description: |
        Replace the ACL rule set for the given type. Admin token required (`admin` scope). The body is an
        array of ACL rules.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/AclRule"
