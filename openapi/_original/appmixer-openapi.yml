  /system/audits:
    get:
      tags:
        - Audit Logs
      summary: Get audit log entries
      operationId: getAuditLogs
      description: |
        Return the audit log entries that match the filters, newest first, one page at a time. Requires
        the `admin` scope. An entry must match all the filters you send.

        **Check that your filters were applied.** A version that does not know a filter ignores it and
        returns the entries as if it had not been sent. `appliedFilters` lists the filter parameters the
        server recognized and applied (`sort`, `page`, `size` and `format` are not filters). If your code
        relies on a filter, fail closed: do not treat the entries as filtered when the response has no
        `appliedFilters` (a version that predates it) or when your filter is missing from it.

        **Paging.** Send `ts` with the time of your first request in every page request, so that entries
        recorded in the meantime do not shift the pages. `page=0` returns all matching entries in one
        response and ignores `size`; the Backoffice CSV export uses it.

        **CSV export.** With `format=csv`, the entries are returned as a CSV file (`data.csv`) with the
        columns `id`, `flowId`, `flowName`, `action`, `created`, `eventType`, `user` (the username),
        `status`, `flatDiff`, `source`, `threadId` and `externalUserId`, in this order. Filters, `sort`,
        `page` and `size` apply as for JSON. The CSV has no `appliedFilters`.

        **Retention.** By default, entries are deleted 100 days after they were recorded
        (`GARBAGE_COLLECTOR_AUDIT_LOGS_TTL` on Appmixer Self-Managed).

        `userId`, `externalUserId` and `appliedFilters` are available since Appmixer 6.5.6; `source` and
        `threadId` since Appmixer 6.5.5.
      parameters:
        - name: eventType
          in: query
          description: Type of the event.
          schema:
            type: string
            enum:
              - create
              - update
              - delete
        - name: status
          in: query
          description: Result of the recorded action.
          schema:
            type: string
            enum:
              - success
              - failure
        - name: username
          in: query
          description: Username of the Appmixer user who made the change. Exact match, not case-sensitive.
          schema:
            type: string
        - name: userId
          in: query
          description: ID of the Appmixer user who made the change.
          schema:
            type: string
            pattern: "^[0-9a-fA-F]{24}$"
        - name: externalUserId
          in: query
          description: ID sent in the `X-Appmixer-Audit-External-User-Id` request header. Exact match, case-sensitive.
          schema:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,128}$"
        - name: flowId
          in: query
          description: ID of the flow the change concerns.
          schema:
            type: string
        - name: source
          in: query
          description: "`copilot` returns the changes made by the AI Copilot."
          schema:
            type: string
            enum:
              - copilot
        - name: threadId
          in: query
          description: ID of the AI Copilot conversation that made the change.
          schema:
            type: string
        - name: dateFrom
          in: query
          description: |
            Entries recorded at or after this date or time, in ISO 8601. A date without a time means midnight UTC.
            A value that cannot be read as a date, such as a Unix timestamp, is refused with `400`.
          schema:
            type: string
          example: "2026-09-01"
        - name: dateTo
          in: query
          description: |
            Entries recorded on or before this day. Send a date without a time; the whole day (UTC) is
            included. A value that cannot be read as a date, such as a Unix timestamp, is refused with `400`.
          schema:
            type: string
          example: "2026-09-30"
        - name: ts
          in: query
          description: |
            Entries recorded at or before this time, as a Unix timestamp in milliseconds. A value that is not
            a whole number, or is too large for a date, is refused with `400`.
          schema:
            type: integer
            format: int64
          example: 1790240400000
        - name: search
          in: query
          description: Full-text search in `action`, `flatDiff`, `status` and the username. Matches whole words; with several words, entries that contain any of them.
          schema:
            type: string
        - name: sort
          in: query
          description: |
            Property to sort by, for example `created`, `eventType`, `action`, `status`, `flowId` or
            `flowName`. Prefix it with `-` for descending order. `source`, `threadId` and `externalUserId`
            cannot be sorted by.
          schema:
            type: string
            default: -created
        - name: page
          in: query
          description: Page number, starting at `1`. `0` returns all matching entries, without paging.
          schema:
            type: integer
            minimum: 0
            default: 1
        - name: size
          in: query
          description: Number of entries per page. With `page=0`, `size` has no upper limit.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - name: format
          in: query
          description: "`csv` returns the entries as a CSV file instead of JSON."
          schema:
            type: string
            enum:
              - csv
      responses:
        "200":
          description: The matching entries.
          headers:
            Content-Range:
              description: Same as `contentRange`. Sent with JSON responses only; a browser cannot read it in a cross-origin request.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogList"
              example:
                data:
                  - id: 66f28a1c9b3e4d0012a7c5e1
                    eventType: update
                    user:
                      id: 66d9c1f47a2b3c0011e4f8a2
                      username: acme@example.com
                      lowername: acme@example.com
                    flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                    flowName: Sync new bookings
                    action: "Update flow: Sync new bookings [9089f275-f5a5-4796-ba23-365412c5666e]"
                    diff:
                      - path: flow.name
                        type: CHANGE
                        changes:
                          before: Sync bookings
                          after: Sync new bookings
                    flatDiff: '[{"path":"flow.name","type":"CHANGE","changes":{"before":"Sync bookings","after":"Sync new bookings"}}]'
                    status: success
                    created: 2026-09-24T09:12:44.102Z
                    externalUserId: staff-42
                contentRange: 0-0/1
                appliedFilters:
                  - dateFrom
                  - externalUserId
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /modifiers:
    get:
      tags:
        - Modifiers
      summary: Get Modifiers
      operationId: getModifiers
      description: |
        Get available modifiers. Appmixer is shipped with its own set of modifiers by default; use this
        endpoint to see what they are. You can then redefine the set with `PUT /modifiers`. Private
        modifiers are omitted. No access token is required.
      security: []
      responses:
        "200":
          description: Modifier categories and modifiers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierDefinitions"
              example:
                categories:
                  object:
                    label: Object
                    index: 1
                  list:
                    label: List
                    index: 2
                modifiers:
                  g_stringify:
                    name: stringify
                    label: Stringify
                    category:
                      - object
                      - list
                    description: Convert an object or list to a JSON string.
                    arguments:
                      - name: space
                        type: number
                        isHash: true
                    returns:
                      type: string
                    helperFn: |-
                      function(value, { hash }) {

                                      return JSON.stringify(value, null, hash.space);
                                  }
                  g_length:
                    name: length
                    label: Length
                    category:
                      - list
                      - text
                    description: Find length of text or list.
                    arguments: []
                    returns:
                      type: number
                    helperFn: |-
                      function(value) {

                                      return value && value.hasOwnProperty('length') ? value.length : 0;
                                  }
    put:
      tags:
        - Modifiers
      summary: Edit Modifiers
      operationId: updateModifiers
      description: |
        Change the modifiers and their categories as a whole. Requires the `admin` scope. Before editing
        existing modifiers or adding new ones, check the `GET /modifiers` endpoint to see the structure.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierDefinitions"
            example:
              categories:
                text:
                  label: Text
                  index: 1
              modifiers:
                g_length:
                  label: Length
                  category:
                    - text
                  description: Find length of text or list.
                  arguments: []
                  returns:
                    type: number
                  helperFn: "function(value) { return value && value.hasOwnProperty('length') ? value.length : 0; }"
      responses:
        "200":
          description: The whole updated definition, like the GET endpoint (including private modifiers and `modifiedBy`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModifierDefinitions"
        "400":
          description: Payload validation failed or a modifier definition is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags:
        - Modifiers
      summary: Delete Modifiers
      operationId: deleteModifiers
      description: Delete all modifiers. Requires the `admin` scope.
      responses:
        "200":
          description: Empty response.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /modifiers/test:
    post:
      tags:
        - Modifiers
      summary: Test Modifier Function
      operationId: testModifier
      description: |
        Test a helper function with the desired arguments, to check how it will behave under different
        conditions. Requires the `admin` scope. The helper function must always return a value;
        if it returns `undefined`, a `400` error is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModifierTestRequest"
            example:
              helperFn: "function(value) { return value && value.hasOwnProperty('length') ? value.length : 0; }"
              arguments:
                - test
      responses:
        "200":
          description: The value returned by the helper function.
          content:
            application/json:
              schema: {}
              example: 4
        "400":
          description: Validation failed, the helper function is invalid, or it returned `undefined`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 400
                error: Bad Request
                message: The function returned "undefined"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /public-files:
    get:
      tags:
        - Public Files
      summary: Get public files
      operationId: getPublicFiles
      description: |
        Returns a list of the public files. The list does not contain the contents of the files.
        Requires the `admin` scope.
      responses:
        "200":
          description: List of public files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PublicFile"
              example:
                - filename: test.txt
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Public Files
      summary: Upload a public file
      operationId: uploadPublicFile
      description: |
        Uploads a public file. The file becomes available at the root of the tenant API URL under the
        given `filename`. Maximum size is 16 MB. Requires the `admin` scope.

        ```
        curl '[TENANT_API_URL]/public-files' \
          --header 'Authorization: Bearer [ADMIN_TOKEN]' \
          --form 'file=@"/tmp/icon.png"' \
          --form 'filename="icon.png"'
        ```
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PublicFileUpload"
          application/json:
            schema:
              type: object
              description: Text content can also be sent as a JSON string.
              properties:
                filename:
                  type: string
                  description: The name for the file.
                file:
                  type: string
                  description: The text content of the file.
              required:
                - filename
                - file
      responses:
        "200":
          description: The file was uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicFileOk"
              example:
                ok: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          description: The file is larger than 16 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /public-files/{filename}:
    delete:
      tags:
        - Public Files
      summary: Remove a public file
      operationId: deletePublicFile
      description: Removes a public file. Requires the `admin` scope.
      parameters:
        - name: filename
          in: path
          required: true
          description: The name of the file you want to remove.
          schema:
            type: string
      responses:
        "200":
          description: |
            The file was removed. The code returns the MongoDB delete result
            (`acknowledged`, `deletedCount`), not `{ "ok": true }` as the docs state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  acknowledged:
                    type: boolean
                  deletedCount:
                    type: integer
              example:
                acknowledged: true
                deletedCount: 1
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /unprocessed-messages:
    get:
      tags:
        - Unprocessed Messages
      summary: Get messages
      operationId: getUnprocessedMessages
      description: |
        Get the list of the unprocessed messages for the current user (messages of the user's own
        flows and flows shared with the user). Admin users get messages of all flows.
      parameters:
        - name: flowId
          in: query
          description: Return only messages of the given flow(s). Can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
        - name: correlationId
          in: query
          description: Return only messages with the given correlation ID.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of messages returned.
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          description: Number of messages to skip.
          schema:
            type: integer
        - name: sort
          in: query
          description: Sorting in the `field:direction` format where direction is `1` (ascending) or `-1` (descending), e.g. `created:-1`.
          schema:
            type: string
          example: created:-1
        - name: filter
          in: query
          description: Filter in the `field:value` format. Multiple filters can be passed comma-separated.
          schema:
            type: string
        - name: projection
          in: query
          description: Comma-separated list of fields to include in (or, prefixed with `-`, exclude from) the returned objects.
          schema:
            type: string
        - name: fromId
          in: query
          description: Internal `_id` of the message from which the paging should start (exclusive).
          schema:
            type: string
      responses:
        "200":
          description: List of unprocessed messages.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UnprocessedMessage"
              example:
                - messageId: a9b78d3c-ec9a-4c0e-81c2-b1df12bd46d7
                  flowId: 796d7b5c-bea0-4594-a9df-a8a0e3c4616e
                  componentId: fdb29d7b-c6b7-423b-adb2-87b41289e925
                  messages:
                    in:
                      - properties:
                          correlationId: 0dcb7b2a-5933-481a-bb9c-c08a865656c0
                          gridInstanceId: null
                          contentType: application/json
                          contentEncoding: utf8
                          sender:
                            componentId: 3961d498-83f8-4714-85ba-0539d3055892
                            type: appmixer.utils.controls.OnStart
                            outputPort: out
                          destination:
                            componentId: fdb29d7b-c6b7-423b-adb2-87b41289e925
                            inputPort: in
                          correlationInPort: null
                          componentHeaders: {}
                          flowId: 796d7b5c-bea0-4594-a9df-a8a0e3c4616e
                          messageId: 12374d7e-5c66-40d1-8772-37c424bd4182
                          flowRunId: 1603726768950
                        content:
                          key: hello
                        scope:
                          3961d498-83f8-4714-85ba-0539d3055892:
                            out:
                              started: 2020-10-26T15:39:29.003Z
                        originalContent:
                          started: 2020-10-26T15:39:29.003Z
                  created: 2020-10-26T15:39:29.097Z
                  err: '{"message":"Component failed."}'
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /unprocessed-messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/UnprocessedMessageIdParam"
    get:
      tags:
        - Unprocessed Messages
      summary: Get message
      operationId: getUnprocessedMessage
