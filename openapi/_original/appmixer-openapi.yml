              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AclRule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/AclTypeParam"
