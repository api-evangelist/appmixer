  /apps:
    get:
      tags:
        - Apps
      summary: Get Apps
      operationId: getApps
      description: |
        Returns all applications available to the authenticated user.

        An "app" is either a **module** (e.g. `appmixer.google.gmail`) or a **service** that does not
        declare any modules (e.g. `appmixer.calendly`). When a service contains at least one module, the
        modules are returned as the apps and the service itself is omitted. The result is keyed by the app
        name and respects the user's ACL (private apps the user cannot see are filtered out).

        By default the `icon` of each app is replaced by a URL pointing to the icon; set
        `compressIcons=false` to get the original inline data URI.

        The access token is optional: without it the request is served as the anonymous public user.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - $ref: "#/components/parameters/AppIgnoreACLQuery"
        - $ref: "#/components/parameters/AppCompressIconsQuery"
      responses:
        "200":
          description: Apps successfully retrieved, keyed by app name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/App"
              example:
                appmixer.asana:
                  name: appmixer.asana
                  label: Asana
                  category: applications
                  description: Asana is a collaborative information manager for workspace. It helps you organize people and tasks effectively.
                  icon: data:image/png;base64,iVBORw0KGgoA....kJggg==
                appmixer.calendly:
                  name: appmixer.calendly
                  label: Calendly
                  category: applications
                  description: Calendly helps you schedule meetings without the back-and-forth emails. It does not work with the free Basic account. It works with Premium or Pro account.
                  icon: data:image/png;base64,iVBORw0KGgoA....kJggg==
                appmixer.dropbox:
                  name: appmixer.dropbox
                  label: Dropbox
                  category: applications
                  description: Dropbox is a home for all your photos, documents, videos, and other files. Dropbox lets you access your stuff from anywhere and makes it easy to share with others.
                  icon: data:image/svg+xml;base64,PHN2Z....3N2Zz4=
        "400":
          description: "`ignoreACL=true` was used by a non-admin user."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /bundles:
    get:
      tags:
        - Apps
      summary: Get Bundles
      operationId: getBundles
      description: |
        Returns the installed bundle versions. Each connector is packaged as a bundle (defined by its
        `bundle.json`); this endpoint reports the currently installed `version` of every bundle, keyed by
        the bundle name. It is useful for checking which connector versions are deployed in your tenant.

        The access token is optional: without it the request is served as the anonymous public user.
      security:
        - bearerAuth: []
        - {}
      responses:
        "200":
          description: Installed bundle versions keyed by bundle name.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/AppBundle"
              example:
                appmixer.asana:
                  version: 1.2.0
                appmixer.calendly:
                  version: 2.0.1
                appmixer.dropbox:
                  version: 1.5.3
        "401":
          $ref: "#/components/responses/Unauthorized"
  /apps/components:
    get:
      tags:
        - Apps
      summary: Get App Components
      operationId: getAppComponents
      description: |
        Returns all components of a single app including their manifest files. Only components the user
        is allowed to use (ACL) are returned.

        The access token is optional: without it the request is served as the anonymous public user.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: app
          in: query
          required: true
          description: ID of an app as defined in `service.json` or `module.json` (e.g. `appmixer.dropbox` or `appmixer.google.gmail`).
          schema:
            type: string
          example: appmixer.twilio
      responses:
        "200":
          description: Component manifests of the app.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentManifest"
              example:
                - name: appmixer.twilio.sms.SendSMS
                  author: David Durman <david@client.io>
                  icon: data:image/png;base64,iVBORw...gg==
                  description: Send SMS text message through Twilio.
                  auth:
                    service: appmixer:twilio
                  inPorts:
                    - name: message
                      schema:
                        type: object
                        properties:
                          body:
                            type: string
                          to:
                            type: string
                        required:
                          - to
                      inspector:
                        inputs:
                          body:
                            type: text
                            label: Text message
                            tooltip: Text message that should be sent.
                            index: 1
                          to:
                            type: text
                            label: To number
                            tooltip: The destination phone number in E.164 format.
                            index: 2
                  properties:
                    schema:
                      properties:
                        fromNumber:
                          type: string
                      required:
                        - fromNumber
                    inspector:
                      inputs:
                        fromNumber:
                          type: select
                          label: From number
                          tooltip: Select Twilio phone number.
                          index: 1
                          source:
                            url: /component/appmixer/twilio/sms/ListFromNumbers?outPort=numbers
                            data:
                              transform: ./transformers#fromNumbersToSelectArray
                - name: appmixer.twilio.calls.NewCall
                  author: David Durman <david@client.io>
                  icon: data:image/png;base64,iVBORw...gg==
                  description: Receive a call through Twilio.
                  auth:
                    service: appmixer:twilio
                  webhook: true
                  webhookAsync: true
                  outPorts:
                    - name: call
                      options: []
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /components:
    get:
      tags:
        - Apps
      summary: Get All Components
      operationId: getComponents
      description: |
        Get all available components (including custom ones) that the user is allowed to use.

        By default the endpoint returns the **full manifest** of every component. To retrieve only the
        list of component type names, set `manifest=no`. When full manifests are returned, the `icon`
        field is, by default, replaced by a URL pointing to the icon (instead of an inline base64 data
        URI) to keep the payload small; set `compressIcons=false` to keep the original inline icons.

        The access token is optional: without it the request is served as the anonymous public user.
      security:
        - bearerAuth: []
        - {}
      parameters:
        - name: manifest
          in: query
          description: When set to `no`, the endpoint returns only an array of component type names. Otherwise (default) it returns the full manifest of each component.
          schema:
            type: string
            examples:
              - no
        - name: selector
          in: query
          description: Restrict the result to a subset of components. A `[vendor].[service].[module].[component]` selector (e.g. `appmixer.google` or `appmixer.google.gmail`).
          schema:
            type: string
        - name: selectors[]
          in: query
          description: Request multiple component patterns in a single call (OR logic), e.g. `?selectors[]=appmixer.google.gmail&selectors[]=appmixer.slack.list.SendChannelMessage`. Useful for progressively loading only the manifests a client needs. `selectors` (without brackets) is accepted as well.
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/AppCompressIconsQuery"
        - $ref: "#/components/parameters/AppIgnoreACLQuery"
      responses:
        "200":
          description: Array of component manifests, or of component type names when `manifest=no`.
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/ComponentManifest"
                  - type: array
                    items:
                      type: string
              examples:
                manifestNo:
                  summary: manifest=no
                  value:
                    - appmixer.asana.projects.CreateProject
                    - appmixer.asana.projects.NewProject
                    - appmixer.asana.tasks.CreateStory
                    - appmixer.calendly.events.InviteeCanceled
                    - appmixer.calendly.events.InviteeCreated
                    - appmixer.clearbit.enrichment.FindCompany
                    - appmixer.clearbit.enrichment.FindPerson
                fullManifests:
                  summary: Default (full manifests)
                  value:
                    - name: appmixer.asana.tasks.CreateStory
                      author: David Durman <david@client.io>
                      description: Create a story (comment) on a task.
                      icon: https://api.appmixer.com/icons/appmixer.asana.tasks.CreateStory
                      auth:
                        service: appmixer:asana
                      inPorts: []
                      outPorts: []
                      properties: {}
        "400":
          description: Query validation failed, or `ignoreACL=true` was used by a non-admin user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Apps
      summary: Publish A Component/Module/Service
      operationId: publishComponent
      description: |
        Publish a new component, new module or an entire service or update an existing
        component/module/service. The uploaded entity must be zipped and must have a proper
        directory/file structure inside (see Basic Component Structure for more details). You can use the
        Appmixer CLI tool to pack your component/service/module to a zip archive (`appmixer pack`
        command). Alternatively, you can use a regular zip command line utility but you should omit the
        `node_modules/` directories before archiving and the root directory of the zip archive must match
        the vendor name. The directory hierarchy must be `[vendor]/[service]/[module]/[component]`.

        The size limit of the zip archive is configured per tenant (10MB by default).

        Publishing can take more time than the lifespan of a single HTTP request. Therefore, the result is
        a JSON object with a `ticket` property. Use the ticket to check the progress of the publish with
        `GET /components/uploader/{ticket}`.

        Admin users can publish any vendor; other users must have a vendor assigned.
      parameters:
        - name: replaceAll
          in: query
          description: When `true`, existing files of the published service/module/component that are not present in the uploaded archive are removed (full replace).
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Zip archive with the component/module/service.
      responses:
        "200":
          description: Upload accepted; use the ticket to poll for progress.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentUploadTicket"
              example:
                ticket: a194d145-3768-4a8a-84a4-4f1e4e08c4ad
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The zip archive exceeds the configured size limit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The request content type is not `application/octet-stream`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /components/{selector}:
    get:
      tags:
        - Apps
      summary: Download a Component/Module/Service
      operationId: downloadComponent
      description: |
        Download the source files of a component, module or an entire service as a zip archive
        (`application/octet-stream`). Compiled code and internal `node_modules.zip` files are excluded
        from the archive. The user must own the selected component(s): admin users can download
        anything, other users only components of their own vendor(s).

        The selector can also target an individual file
        (`appmixer.myservice.mymodule.MyComponent/MyComponent.js`); the `/` must then be URL-encoded
        (`%2F`).
      responses:
        "200":
          description: Zip archive with the source files.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Nothing corresponds to the selector.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: There is nothing that corresponds to appmixer.myservice.
      parameters:
        - name: selector
          in: path
          required: true
          description: A selector of the form `[vendor].[service].[module].[component]`, e.g. `appmixer.google.calendar.CreateEvent` (one component), `appmixer.google.calendar` (the calendar module) or `appmixer.google` (the entire Google service).
          schema:
            type: string
          example: appmixer.myservice
    delete:
      tags:
        - Apps
      summary: Delete a Component/Module/Service
      operationId: deleteComponent
      description: |
        Delete a component/module or an entire service. Admin users can delete anything, other users only
        components of their own vendor(s).
      parameters:
        - name: selector
          in: path
          required: true
          description: A selector of the form `[vendor].[service].[module].[component]`, e.g. `appmixer.google.calendar.CreateEvent` (one component), `appmixer.google.calendar` (the calendar module) or `appmixer.google` (the entire Google service).
          schema:
            type: string
          example: appmixer.myservice
        - name: doNotRemoveCollections
          in: query
          description: When `true`, the database collections associated with the deleted component(s) are preserved instead of being dropped.
          schema:
            type: boolean
      responses:
        "200":
          description: Empty object. Note that errors during deletion are only recorded in the audit log; the response is always `{}`.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /components/uploader/{ticket}:
    get:
      tags:
        - Apps
      summary: Check for Publishing Progress
      operationId: getComponentUploadStatus
      description: Check for progress of publishing a component.
      parameters:
        - name: ticket
          in: path
          required: true
          description: Ticket that you got from the `POST /components` request.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Upload status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentUploadStatus"
              examples:
                success:
                  summary: Successful upload, no errors
                  value:
                    finished: 2020-02-28T15:57:34.549Z
                failure:
                  summary: Upload finished with errors
                  value:
                    finished: 2020-02-28T15:25:39.515Z
                    err: Invalid schema for appmixer/utils/service.json
                    data:
                      - keyword: required
                        dataPath: ""
                        schemaPath: "#/required"
                        params:
                          missingProperty: label
                        message: should have required property 'label'
                      - keyword: required
                        dataPath: ""
                        schemaPath: "#/required"
                        params:
                          missingProperty: description
                        message: should have required property 'description'
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: There is no upload under the ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: There's no upload under ticket 2e9dd726-2b7f-46f7-bea4-8db7f7175aa8
  /component/{vendor}/{service}/{module}/{component}:
    post:
      tags:
        - Apps
      summary: Call a Component Statically
      operationId: callComponentStatic
      description: |
        Execute a single component outside of a running flow ("static call"). This is the mechanism used
        internally to resolve dynamic dropdown options in the Inspector, and by the AI Agent to invoke its
        tools. Either `componentId` or `callerId` is required; the user must own the flow that contains
        that component instance.
      parameters:
        - name: vendor
          in: path
          required: true
          schema:
            type: string
          example: appmixer
        - name: service
          in: path
          required: true
          schema:
            type: string
          example: twilio
        - name: module
          in: path
          required: true
          schema:
            type: string
          example: sms
        - name: component
          in: path
          required: true
          schema:
            type: string
          example: ListFromNumbers
        - name: outPort
          in: query
          description: The output port whose result should be returned.
          schema:
            type: string
          example: numbers
        - name: ignoreAuth
          in: query
          description: When `true`, skip authentication (account resolution) for the component.
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: silentAuth
          in: query
          description: When `true`, try to authenticate but do not fail when no token is found.
          schema:
            type: string
            enum:
              - "true"
              - "false"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentStaticCallRequest"
            example:
              componentId: e25dc901-f92a-46a2-8d29-2573d4ad65e5
      responses:
        "200":
          description: The output of the component on the requested output port. The shape depends on the component.
          content:
            application/json:
              schema: {}
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/{componentType}:
    get:
      tags:
        - Accounts
      summary: Get Accounts
      operationId: getAccountsByComponentType
      description: |
        Get the list of accounts the user has previously authenticated with for this component type.
        Only accounts that have a valid access token with a sufficient scope for the component type are
        returned.
      parameters:
        - $ref: "#/components/parameters/AccountComponentTypeParam"
        - name: componentId
          in: query
          required: false
          description: |
            Component ID. When set, the response indicates whether an account is assigned to this component
            (`componentAssigned`). Can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: e15ef119-8fcb-459b-aaae-2a3f9ee41f15
        - name: flowId
          in: query
          required: false
          description: Flow ID. When set (and `componentId` is not), the scope is computed from the components of this flow that match the component type.
          schema:
            type: string
      responses:
        "200":
          description: Authentication status and accounts for the component type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountComponentTypeAuth"
              example:
                componentType: appmixer.slack.list.SendChannelMessage
                auth:
                  accounts:
                    5a6e21f3b266224186ac7d03:
                      accessTokenValid: true
                      accountId: 5a6e21f3b266224186ac7d03
                      tokenId: 5a6e21f3b266224186ac7d04
                      componentAssigned: true
                      componentId: e25dc901-f92a-46a2-8d29-2573d4ad65e5
                      scopeValid: true
                      authorizedScope:
                        - channels:read
                        - chat:write:user
                      name: U0UFJ0MFG - client IO
                      displayName: client IO
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts:
    get:
      tags:
        - Accounts
      summary: Get All Accounts
      operationId: getAccounts
      description: |
        Get the list of all accounts the user has authenticated with to any component. Revoked accounts
        are not returned.

        Example of filtering out certain accounts (all `acme` accounts and AWS accounts):
        `GET /accounts?filter=service:!acme:[service]&filter=service:!appmixer:aws`
      parameters:
        - name: filter
          in: query
          required: false
          description: |
            Filter accounts. The format is `property:value` (equals) or `property:!value` (not equals),
            for example `service:appmixer:slack`. The parameter can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          example: service:!appmixer:aws
        - name: projection
          in: query
          required: false
          description: Comma-separated list of properties to include (`name,service`) or exclude (`-profileInfo`).
          schema:
            type: string
      responses:
        "200":
          description: List of accounts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Account"
              example:
                - accountId: 5a6e21f3b266224186ac7d03
                  name: U0UFJ0MFG - client IO
                  displayName: null
                  service: appmixer:slack
                  userId: 58593f07c3ee4f239dc69ff7
                  profileInfo:
                    id: U0UFJ0MFG - client IO
                - accountId: 5a7313abb3a60729efe76f1e
                  name: t.o.mas@client.io
                  displayName: null
                  service: appmixer:pipedrive
                  userId: 58593f07c3ee4f239dc69ff7
                  profileInfo:
                    name: tomas
                    email: t.o.mas@client.io
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Accounts
      summary: Create Account
      operationId: createAccount
      description: |
        Create an account. Usually, an account is created when the user authenticates a component. There
        are scenarios where it is beneficial to create an account without user interaction (Integrations).
        There has to be an authentication module (`auth.js`) installed in Appmixer corresponding to the
        `service` ID. All the built-in authentication types are supported (OAuth 1, OAuth 2, API Key,
        password).

        The structure of `token` depends on the authentication type:

        - OAuth 2: `accessToken` (required), `refreshToken`, `expDate` and `scope`.
        - OAuth 1: `accessToken` and `accessTokenSecret` (both required).
        - API Key / password: whatever fields the auth module expects, e.g. `apiKey`, or `username` and `password`.

        For OAuth accounts, the `scope` of the token is validated against the scopes required by the
        components of the service installed in Appmixer, unless `validateScope=false`.

        The `profileInfo` object is optional. If you provide it, it will be used. If you don't, the
        `requestProfileInfo` function of the authentication module is called to get the profile info.
      parameters:
        - name: validateScope
          in: query
          required: false
          description: If `false`, the scope of the token from the body won't be validated against components installed in Appmixer (OAuth only).
          schema:
            type: string
            enum:
              - "true"
              - "false"
        - name: requestProfileInfo
          in: query
          required: false
          description: |
            If `false`, the `requestProfileInfo` function of the auth module won't be called (OAuth). For API Key
            and password accounts, `true` forces the call even when `profileInfo` is provided.
          schema:
            type: string
            enum:
              - "true"
              - "false"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCreateRequest"
            examples:
              oauth2Slack:
                summary: Slack (OAuth 2) account
                value:
                  service: appmixer:slack
                  token:
                    accessToken: "[slack access token]"
                    scope:
                      - channels:write
                      - groups:write
                      - channels:read
                      - channels:history
                      - groups:read
                      - groups:history
                      - users:read
                      - chat:write:user
                  profileInfo:
                    id: "[Name of the account that will be used in the frontend]"
              oauth2Google:
                summary: Google (OAuth 2) account with access token expiration
                value:
                  service: appmixer:google
                  token:
                    accessToken: "[google access token]"
                    expDate: 2021-02-04 15:34:48.833Z
                    refreshToken: "[google refresh token]"
                    scope:
                      - https://www.googleapis.com/auth/drive
                      - https://mail.google.com/
                      - profile
                      - email
              apiKey:
                summary: API Key account
                value:
                  service: appmixer:aws
                  token:
                    accessKeyId: "[AWS access key ID]"
                    secretKey: "[AWS secret key]"
              password:
                summary: Password account
                value:
                  service: appmixer:acme
                  token:
                    username: "[username]"
                    password: "[password]"
      responses:
        "200":
          description: The created account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
              example:
                accountId: 5f841f3a43f477a9fa8fa4e9
                name: "[Name of the account]"
                displayName: null
                service: "[vendor:service]"
                userId: 5f804b96ea48ec47a8c444a7
                profileInfo: {}
                pre: {}
                revoked: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /accounts/{accountId}:
    put:
      tags:
        - Accounts
      summary: Update Account Info
      operationId: updateAccount
      description: |
        Update account information. Currently, only the display name can be updated. The display name is
        visible in the Designer inspector when selecting available accounts for a component type and also on
        the Accounts page.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                displayName:
                  type: string
                  minLength: 3
                  maxLength: 40
                  description: Human-readable name of the account.
            example:
              displayName: My Account Name
      responses:
        "200":
          description: The updated account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Accounts
      summary: Remove Account
      operationId: deleteAccount
      description: |
        Remove the account and stop all the flows that this account is used in. The account's tokens are
        deleted and the account is marked as revoked.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      responses:
        "200":
          description: The account was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                required:
                  - accountId
              example:
                accountId: 5abcd0ddc4c335326198c1b2
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{accountId}/test:
    post:
      tags:
        - Accounts
      summary: Test Account
      operationId: testAccount
      description: Test account. Check if the credentials (tokens) of the account are still valid.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      responses:
        "200":
          description: Result of the test. `ok` is `true` if at least one of the account's tokens is valid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                required:
                  - ok
              example:
                ok: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{accountId}/flows:
    get:
      tags:
        - Accounts
      summary: List All Flows Using Account
      operationId: getAccountFlows
      description: List all the flows where the account is used.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      responses:
        "200":
          description: Flows that use the account.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    flowId:
                      type: string
                    name:
                      type: string
                  required:
                    - flowId
                    - name
              example:
                - flowId: 9251b4b6-4cdb-42ad-9431-1843e05307be
                  name: "Flow #1"
                - flowId: 777d3024-43f6-4034-ac98-1cb5f320cb3a
                  name: "Flow #2"
                - flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                  name: "Flow #3"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /accounts/{accountId}/share:
    post:
      tags:
        - Accounts
      summary: Share Account
      operationId: shareAccount
      description: |
        Share your account with an integration template so that instances created from the template can use
        your account. This is useful when you want template users to access shared resources (like a database
        or API) without requiring them to provide their own credentials.

        Account sharing is done at the component level, not the template level. This allows you to share your
        account for specific components while requiring users to connect their own accounts for other
        components in the same template.

        Shared accounts are locked to specific component types, components can only access tokens with the
        required scopes, and shared account credentials are masked in logs for non-owners. The account must
        have at least one valid token with the scope required by each of the component types, otherwise
        `400` is returned.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flowId:
                  type: string
                  description: ID of the integration template to share the account with.
                componentIds:
                  type: array
                  items:
                    type: string
                  description: IDs of the template components that should use this shared account.
              required:
                - flowId
                - componentIds
            example:
              flowId: integration-template-id
              componentIds:
                - component-1
                - component-2
      responses:
        "200":
          description: The account was shared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                  flowId:
                    type: string
                  shared:
                    type: array
                    items:
                      type: object
                      properties:
                        componentId:
                          type: string
                        componentType:
                          type: string
                required:
                  - accountId
                  - flowId
                  - shared
              example:
                accountId: 5a6e21f3b266224186ac7d03
                flowId: 9089f275-f5a5-4796-ba23-365412c5666e
                shared:
                  - componentId: component-1
                    componentType: appmixer.gmail.SendEmail
                  - componentId: component-2
                    componentType: appmixer.slack.SendMessage
        "400":
          description: Validation failed, or the account doesn't have valid tokens with the required scope for a component type.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 400
                error: Bad Request
                message: "No valid tokens found for componentType: appmixer.gmail.SendEmail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The account or the integration template doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: Flow 9089f275-f5a5-4796-ba23-365412c5666e not found
  /accounts/{accountId}/unshare:
    post:
      tags:
        - Accounts
      summary: Unshare Account
      operationId: unshareAccount
      description: |
        Remove account sharing from an integration template. This immediately revokes access for all
        instances created from the template: components using the shared account lose access and flows may
        stop working.
      parameters:
        - $ref: "#/components/parameters/AccountIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                flowId:
                  type: string
                  description: ID of the integration template to unshare from.
              required:
                - flowId
            example:
              flowId: integration-template-id
      responses:
        "200":
          description: The account was unshared.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                  flowId:
                    type: string
                required:
                  - accountId
                  - flowId
              example:
                accountId: 5a6e21f3b266224186ac7d03
                flowId: 9089f275-f5a5-4796-ba23-365412c5666e
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The account or the integration template doesn't exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 404
                error: Not Found
                message: Flow 9089f275-f5a5-4796-ba23-365412c5666e not found
  /auth/ticket:
    post:
      tags:
        - Accounts
      summary: Generate Authentication Session Ticket
      operationId: createAuthTicket
      description: |
        Generate an authentication session ticket. This is the first call to be made before the user can
        authenticate to a service. The flow is as follows:

        1. Generate an authentication session ticket.
        2. Get an authentication URL (`GET /auth/{componentType}/auth-url/{ticket}`).
        3. Open the authentication URL in a browser to start the authentication flow.
        4. Once the user completes the authentication flow, the browser redirects the user to a special
           Appmixer page which posts a message of the form `appmixer.auth.[success/failure].[ticket]` via the
           [`window.postMessage()`](https://developer.mozilla.org/en-US/docs/Web/API/Window/postMessage) call.
           Alternatively, poll `GET /auth/status/{ticket}`.

        Note that this is a low-level mechanism that you don't normally have to deal with. The Appmixer JS SDK
        handles all this for you.
      responses:
        "200":
          description: A new authentication session ticket.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ticket:
                    type: string
                    description: Ticket in the form `<userId>:<uuid>`.
                required:
                  - ticket
              example:
                ticket: 58593f07c3ee4f239dc69ff7:1d2a90df-b192-4a47-aaff-5a80bab66de5
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/{componentType}/auth-url/{ticket}:
    get:
      tags:
        - Accounts
      summary: Get Authentication URL
      operationId: getAuthUrl
      description: |
        Get the URL the user should be redirected to (or that should be opened in a popup window) to
        authenticate to the service of the component type. For API key and password based services, the
        response also contains the definition of the form inputs.
      parameters:
        - $ref: "#/components/parameters/AccountComponentTypeParam"
        - $ref: "#/components/parameters/AccountAuthTicketParam"
        - name: componentId
          in: query
          required: false
          description: Component ID. The resulting account will be assigned to this component. Can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: flowId
          in: query
          required: false
          description: Flow ID. If not set, it is derived from `componentId`.
          schema:
            type: string
        - name: configName
          in: query
          required: false
          description: Name of a custom (user-specific) OAuth configuration to use.
          schema:
            type: string
      responses:
        "200":
          description: The authentication URL.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authUrl:
                    type: string
                  inputs:
                    type: object
                    description: Form inputs definition (API key and password services only).
                    additionalProperties: true
                required:
                  - authUrl
              example:
                authUrl: https://slack.com/oauth/authorize?response_type=code&client_id=25316748213.218351034294&redirect_uri=http%3A%2F%2Flocalhost%3A2200%2Fauth%2Fslack%2Fcallback&state=38133t07c3ee4f369dc69ff7%3A1d2a90df-b192-4a47-aaff-5a80bab66de5&scope=channels%3Aread%2Cchat%3Awrite%3Auser
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/status/{ticket}:
    get:
      tags:
        - Accounts
      summary: Get Authentication Status
      operationId: getAuthStatus
      description: |
        Get the status of the authentication session identified by the ticket. Use it to poll for the result
        of the authentication flow started with the authentication URL.
      parameters:
        - $ref: "#/components/parameters/AccountAuthTicketParam"
      responses:
        "200":
          description: Status of the authentication session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountAuthSessionStatus"
              example:
                accountId: 5bc0bad6f4cb78001167b173
                tokenId: 65c49d44e49f774bb587c4e1
                finished: true
                updatedAt: 2024-02-08T09:22:12.496Z
                error: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/component/{componentId}:
    delete:
      tags:
        - Accounts
      summary: Clear Authentication From Component
      operationId: clearComponentAuth
      description: |
        Clear authentication associated with the component. Note that this call does not remove the account,
        it only removes the association of an account with a component.
      parameters:
        - $ref: "#/components/parameters/AccountAuthComponentIdParam"
      responses:
        "200":
          description: The association was removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  componentId:
                    type: string
                required:
                  - componentId
              example:
                componentId: e25dc901-f92a-46a2-8d29-2573d4ad65e5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/component/{componentId}/{accountId}:
    put:
      tags:
        - Accounts
      summary: Assign Account To Component
      operationId: assignAccountToComponent
      description: |
        Assign an account to a component. The account's service has to match the service of the component
        and the user needs permission to edit the flow the component belongs to.
      parameters:
        - $ref: "#/components/parameters/AccountAuthComponentIdParam"
        - $ref: "#/components/parameters/AccountIdParam"
      responses:
        "200":
          description: The account was assigned to the component.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                  componentId:
                    type: string
                required:
                  - accountId
                  - componentId
              example:
                accountId: 5a6e21f3b266224186ac7d03
                componentId: e25dc901-f92a-46a2-8d29-2573d4ad65e5
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users:
    get:
      tags:
        - User
      summary: Get all users
      operationId: getUsers
      description: |
        List users. Admin token required (`admin` scope).

        Group users (the internal users that own User Group resources) are excluded unless you ask for
        them with `type=group`, `type=all` or `filter=type:group`.

        Examples: get the first 30 users with the scope `acme1`:
        `GET /users?filter=scope:acme1&sort=created:-1&limit=30&offset=0`.
        Get all users whose usernames or emails include a pattern: `GET /users?pattern=joe`.
      parameters:
        - $ref: "#/components/parameters/UserListLimitParam"
        - $ref: "#/components/parameters/UserListOffsetParam"
        - $ref: "#/components/parameters/UserListSortParam"
        - $ref: "#/components/parameters/UserListFilterParam"
        - $ref: "#/components/parameters/UserListProjectionParam"
        - $ref: "#/components/parameters/UserListFromIdParam"
        - $ref: "#/components/parameters/UserListPatternParam"
        - $ref: "#/components/parameters/UserListUserIdsParam"
        - $ref: "#/components/parameters/UserListTypeParam"
        - $ref: "#/components/parameters/UserListGroupIdParam"
      responses:
        "200":
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/count:
    get:
      tags:
        - User
      summary: Get the number of users
      operationId: getUsersCount
      description: |
        Get the number of users matching the query. Admin token required (`admin` scope). Accepts the
        same filtering query parameters as `GET /users`.
      parameters:
        - $ref: "#/components/parameters/UserListFilterParam"
        - $ref: "#/components/parameters/UserListFromIdParam"
        - $ref: "#/components/parameters/UserListPatternParam"
        - $ref: "#/components/parameters/UserListUserIdsParam"
        - $ref: "#/components/parameters/UserListTypeParam"
        - $ref: "#/components/parameters/UserListGroupIdParam"
      responses:
        "200":
          description: Number of users.
          content:
            application/json:
              schema:
                type: object
                required:
                  - count
                properties:
                  count:
                    type: integer
              example:
                count: 42
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userId}:
    get:
      tags:
        - User
      summary: Get User Information
      operationId: getUser
      description: Get a user by ID. Admin token required (`admin` scope).
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
    put:
      tags:
        - User
      summary: Update user
      operationId: updateUser
      description: |
        Update a user. Admin token required (`admin` scope). Adding or removing the `admin` scope also adds
        the user to, or removes them from, the default admin user group.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
            example:
              scope:
                - user
                - acme1
              metadata:
                department: sales
              aiContext: "Timezone: Europe/Prague."
      responses:
        "200":
          description: The updated user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserRecord"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
    delete:
      tags:
        - User
      summary: Delete user
      operationId: deleteUser
      description: |
        Admin token required (`admin` scope). This operation stops all running flows and deletes all the
        user's data from the system - logs, accounts, tokens and more. The operation may take a long time,
        so the response is a ticket that you can use to poll for the result with
        `GET /users/{userId}/delete-status/{ticket}`.
      responses:
        "200":
          description: The deletion started. Returns a ticket for polling the status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTaskTicket"
              example:
                ticket: 830639e3-c53a-42d6-ad43-0276674236b4
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
  /users/{userId}/delete-status/{ticket}:
    get:
      tags:
        - User
      summary: Get user deletion status
      operationId: getUserDeleteStatus
      description: |
        Poll the status of a user deletion started with `DELETE /users/{userId}`. Admin token required
        (`admin` scope). `stepsDone` and `stepsTotal` can be used to display a progress bar.
      responses:
        "200":
          description: Status of the deletion task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserTaskStatus"
              example:
                status: in-progress
                stepsDone: 4
                stepsTotal: 10
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
        - name: ticket
          in: path
          required: true
          description: Ticket returned by `DELETE /users/{userId}`.
          schema:
            type: string
  /user/change-password:
    post:
      tags:
        - User
      summary: Change user password
      operationId: changeUserPassword
      description: |
        Change the password of the current user. User token required. Not available for users that sign in
        with SSO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
              properties:
                oldPassword:
                  type: string
                  description: Old password.
                newPassword:
                  type: string
                  minLength: 12
                  description: |
                    New password. The minimum length is set by the `USER_PASSWORD_MIN_LENGTH` environment
                    variable (12 by default).
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
              example:
                message: password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The old password does not match.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /user/reset-password:
    post:
      tags:
        - User
      summary: Reset user password
      operationId: resetUserPassword
      description: |
        Set a new password for any user, identified by their email address. Admin token required
        (`admin` scope). Not available for users that sign in with SSO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: User email address.
                password:
                  type: string
                  minLength: 12
                  description: |
                    New password. The minimum length is set by the `USER_PASSWORD_MIN_LENGTH` environment
                    variable (12 by default).
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
              example:
                message: password changed
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /user/forgot-password:
    post:
      tags:
        - User
      summary: Forgot Password
      operationId: forgotUserPassword
      description: |
        Start the forgot-password process. If the email address belongs to a user, Appmixer generates a
        unique code and sends the user a link to reset their password (by email, or through the
        forgot-password webhook if one is configured). The response is the same whether or not the email
        exists. See the Forgot Password Service system configuration for more details.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: Email address.
      responses:
        "200":
          description: The request was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
              example:
                message: If provided email exists in our system you will receive an email to reset your password.
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          description: Sending the email failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
        "503":
          description: No email service is configured.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
              example:
                message: Forgot Password Service is not available, please contact support.
  /user/forgot-password/reset:
    post:
      tags:
        - User
      summary: Reset forgotten password
      operationId: resetForgottenUserPassword
      description: Reset the user's password with the unique code generated by `POST /user/forgot-password`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - password
              properties:
                code:
                  type: string
                  description: Code generated by `POST /user/forgot-password`.
                password:
                  type: string
                  minLength: 12
                  description: |
                    New password. The minimum length is set by the `USER_PASSWORD_MIN_LENGTH` environment
                    variable (12 by default).
      responses:
        "200":
          description: The password was changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserMessage"
              example:
                message: Password has been changed successfully.
        "400":
          description: Invalid payload, or the code is invalid or expired.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: "#/components/schemas/UserMessage"
                  - $ref: "#/components/schemas/Error"
              example:
                message: Invalid or expired code
  /users/{userId}/groups:
    get:
      tags:
        - User Groups
      summary: List User's Groups
      operationId: getUserGroupsOfUser
      description: |
        Get all groups that a specific user belongs to. Users can only list their own groups; admins
        (`admin` scope) can list the groups of any user.
      responses:
        "200":
          description: Groups the user is a member of.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserGroup"
              example:
                - id: 5f8a7b2c3d4e5f6a7b8c9d0e
                  groupUserId: 5f8a7b2c3d4e5f6a7b8c9d01
                  name: Marketing Team
                  metadata:
                    department: marketing
                  isDefault: false
                  created: 2023-03-15T17:27:14.567Z
                  updated: 2023-03-15T17:27:14.567Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      parameters:
        - $ref: "#/components/parameters/UserIdParam"
  /user-groups:
    post:
      tags:
        - User Groups
      summary: Create User Group
      operationId: createUserGroup
      description: Create a new user group. Admin token required (`admin` scope).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the user group.
                metadata:
                  type: object
                  description: Optional metadata for the group.
            example:
              name: Marketing Team
              metadata:
                department: marketing
      responses:
        "201":
          description: The group was created.
