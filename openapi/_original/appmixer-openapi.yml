  /variables/{flowId}/fetch:
    parameters:
      - $ref: "#/components/parameters/FlowIdParam"
    post:
      tags:
        - Variables
      summary: Get flow variables
      operationId: getFlowVariables
      description: |
        Get variables. Variables are placeholders that can be used in component config or inputs.
        These placeholders are replaced either at runtime by data coming from components connected
        back in the chain (dynamic variables) or by real values (static variables).

        When `components.IDs` is empty, variables for the whole flow are returned (this is what the
        Designer calls when a flow is opened). Requires read permission on the flow.
      parameters:
        - name: compress
          in: query
          description: When `true`, dynamic component variables are de-duplicated into a separate `dynamicComponentVariables` object.
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                useCache:
                  type: boolean
                  default: true
                flow:
                  type: boolean
                  default: true
                  description: If `true`, the response object contains flow (global) variables too.
                components:
                  type: object
                  properties:
                    IDs:
                      type: array
                      items:
                        type: string
                      default: []
                      description: Array of component IDs.
                    links:
                      type: boolean
                      default: true
                      description: If `true`, the response contains input link variables for the given component IDs.
                    properties:
                      type: boolean
                      default: true
                      description: If `true`, the response contains properties variables for the given component IDs.
                    examples:
                      type: boolean
                      default: false
                      description: Include example values.
            example:
              useCache: true
              flow: false
              components:
                IDs:
                  - bd9891a7-3303-43d4-a223-714a8db11e05
                properties: true
                links: false
      responses:
        "200":
          description: Variables.
          content:
            application/json:
              schema:
                type: object
                properties:
                  components:
                    type: object
                    description: Map of component ID to its `links` and/or `properties` variables.
                    additionalProperties:
                      type: object
                      properties:
                        links:
                          type: object
                          additionalProperties: true
                        properties:
                          type: object
                          additionalProperties: true
                  dynamicComponentVariables:
                    type: object
                    additionalProperties: true
                    description: Present only with `compress=true`.
                  flow:
                    type: array
                    description: Flow (global) variables. Present only when `flow` is `true`.
                    items:
                      type: object
                      properties:
                        label:
                          type: string
                        category:
                          type: array
                          items:
                            type: string
                        name:
                          type: string
              example:
                components:
                  e58aba53-cc20-4847-b3ef-c0d35d5e4421:
                    links:
                      message:
                        a6bb7a84-89c5-41e9-8b59-6a3264a49272:
                          out:
                            inspector: {}
                            variables:
                              static: {}
                              dynamic:
                                - componentId: 9f9542a2-b37d-4280-aa54-87f21912701b
                                  hardwired: true
                                  label: Start time
                                  port: out
                                  value: "{{{$.9f9542a2-b37d-4280-aa54-87f21912701b.out.started}}}"
                    properties:
                      inspector:
                        inputs: {}
                        groups: {}
                        errors:
                          inputs: []
                      variables:
                        static:
                          channelId:
                            - label: My Channel
                              value: "123"
                      schema: {}
                flow:
                  - label: Flow ID
                    category:
                      - Control
                    name: g_flowId
                  - label: Flow Name
                    category:
                      - Control
                    name: g_flowName
                  - label: Now (ISO 8601)
                    category:
                      - Date
                    name: g_now
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /categories:
    get:
      tags:
        - Integration Categories
      summary: List Categories
      operationId: getCategories
      description: Get all categories. Available to all authenticated users.
      responses:
        "200":
          description: List of categories.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Category"
              example:
                - id: 5f8a7b2c3d4e5f6a7b8c9d0e
                  name: CRM
                  description: Customer relationship management integrations
                  created: 2023-03-15T17:27:14.567Z
                  mtime: 2023-03-15T17:27:14.567Z
                - id: 5f8a7b2c3d4e5f6a7b8c9d0f
                  name: Marketing
                  description: Marketing automation and analytics tools
                  created: 2023-03-15T17:27:14.568Z
                  mtime: 2023-03-15T17:27:14.568Z
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Integration Categories
      summary: Create Category
      operationId: createCategory
      description: |
        Create a new category. Requires the `admin` scope. Category names must be unique across the
        system; creating a category with a name that already exists returns `400`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CategoryCreate"
            example:
              name: CRM
              description: Customer relationship management integrations
      responses:
        "201":
          description: Category created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              example:
                id: 5f8a7b2c3d4e5f6a7b8c9d0e
                name: CRM
                description: Customer relationship management integrations
                created: 2023-03-15T17:27:14.567Z
                mtime: 2023-03-15T17:27:14.567Z
        "400":
          description: Validation failed or a category with this name already exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                statusCode: 400
                error: Bad Request
                message: Category with this name already exists.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /categories/{categoryId}:
    get:
      tags:
        - Integration Categories
      summary: Get Category
      operationId: getCategory
      description: Get details of a specific category. Available to all authenticated users.
      responses:
        "200":
          description: The category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Category"
              example:
                id: 5f8a7b2c3d4e5f6a7b8c9d0e
                name: CRM
                description: Customer relationship management integrations
                created: 2023-03-15T17:27:14.567Z
                mtime: 2023-03-15T17:27:14.567Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Category not found. The response body is `null`.
          content:
            application/json:
              schema:
                type: "null"
      parameters:
        - $ref: "#/components/parameters/CategoryIdParam"
    put:
      tags:
        - Integration Categories
      summary: Update Category
      operationId: updateCategory
