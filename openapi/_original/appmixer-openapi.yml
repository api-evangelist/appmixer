  /telemetry:
    get:
      tags:
        - Insights
      summary: Get Usage Information for Current User
      operationId: getTelemetry
      description: |
        Get usage information for the signed-in user: number of messages in the given period,
        number of running flows, number of active connectors (components in running flows) and the
        list of apps used.
      parameters:
        - name: from
          in: query
          description: From date, in the `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
          example: 2018-03-17
        - name: to
          in: query
          description: To date, in the `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
          example: 2018-04-17
      responses:
        "200":
          description: Usage information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryUsage"
              example:
                messageCounts:
                  from: 2018-03-17
                  to: 2018-04-17
                  count: 348
                  userId: 58593f07c3ee4f239dc69ff7
                runningFlows:
                  userId: 58593f07c3ee4f239dc69ff7
                  count: 4
                activeConnectors:
                  userId: 58593f07c3ee4f239dc69ff7
                  count: 8
                usedApps:
                  - appmixer.utils
                  - appmixer.slack
                  - appmixer.asana
                  - appmixer.salesforce
                  - appmixer.twilio
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /telemetry/messages:
    get:
      tags:
        - Insights
      summary: Get Usage Information For Other Users
      operationId: getTelemetryMessages
      description: |
        Get message usage information (message count and size, grouped by month) for users
        identified by the `userId` query parameter. If `userId` is omitted, the statistics are
        computed across all users.

        Requires the `admin` scope.
      parameters:
        - name: userId
          in: query
          description: A user ID. Can be repeated to aggregate statistics for multiple users.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          style: form
          explode: true
          example: "54324413432141432"
        - name: from
          in: query
          description: From date, in the `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
          example: 2024-01-01
        - name: to
          in: query
          description: To date, in the `YYYY-MM-DD` format.
          schema:
            type: string
            format: date
          example: 2024-02-01
      responses:
        "200":
          description: Message usage statistics.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryMessageStats"
              example:
                from: 2024-01-01
                to: 2024-02-01
                totalCount: 24
                totalSize: 8050
                stats:
                  - size: 1772
                    count: 4
                    date: 2024-02
                  - size: 6278
                    count: 20
                    date: 2024-01
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /telemetry/flows/{flowId}:
    get:
      tags:
        - Insights
      summary: Get Flow Usage Information
      operationId: getFlowTelemetry
      description: |
        Get usage information (total message count and size) for a flow identified by `flowId`.
        The user must own the flow, have it shared with them, or have the `admin` scope.
      parameters:
        - name: flowId
          in: path
          required: true
          description: The flow ID.
          schema:
            type: string
          example: ef4324-431ff-434fadf-424
      responses:
        "200":
          description: Flow usage information.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelemetryFlowStats"
              example:
                totalCount: 10
                totalSize: 9220
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /files:
    get:
      tags:
        - Files
      summary: Get user files
      operationId: getFiles
      description: |
        Returns the metadata of the files of the current user (the file content is not included).
        Supports paging, sorting and filtering.

        Example: `GET /files?limit=10&filter=filename:~invoice&sort=filename:1` returns 10 files with
        `invoice` in the filename.

        Users with the `admin` scope (except group users) see the files of all users and can narrow the
        result with `filter=userId:<userId>`.
      parameters:
        - $ref: "#/components/parameters/FileLimitParam"
        - $ref: "#/components/parameters/FileOffsetParam"
        - $ref: "#/components/parameters/FileSortParam"
        - $ref: "#/components/parameters/FileProjectionParam"
        - $ref: "#/components/parameters/FileFilterParam"
        - $ref: "#/components/parameters/FileIncludeComponentSourceFilesParam"
      responses:
        "200":
          description: List of file metadata objects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/File"
              example:
                - length: 2366210
                  chunkSize: 261120
                  uploadDate: 2022-09-14T15:25:33.281Z
                  filename: 3mb.pdf
                  md5: 69604bdd54ff681ecd0bf166544c0854
                  metadata:
                    userId: 6123bbeb34598f20b676833b
                  contentType: application/pdf
                  fileId: 7b917904-41b8-4c66-9f5f-0c1bf897eab6
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Files
      summary: Upload a file
      operationId: uploadFile
      description: |
        Upload a file to Appmixer. Uploads by chunks are supported; whether the sent file is treated as a
        chunk of an existing file or as a new file depends on the `uploader-*` headers. The request must
        be `multipart/form-data`. The first file part of the form is stored (the field name is not checked).

        The `fileId` in the response can be used to upload more chunks for the same file, or in other
        endpoints to reference this file.
      parameters:
        - name: uploader-file-id
          in: header
          required: false
          description: |
            If set, the uploaded content is appended as a chunk to the file with this ID. If not present,
            a new file is created. The response includes the resulting file's ID, so it can be used in
            subsequent requests to add chunks to the file.
          schema:
            type: string
            format: uuid
        - name: uploader-file-name
          in: header
          required: false
          description: The name of the file. Ignored when the `uploader-file-id` header is present.
          schema:
            type: string
        - name: uploader-chunk-size
          in: header
          required: false
          description: The size in bytes of the file/chunk being uploaded.
          schema:
            type: integer
        - name: uploader-chunk-number
          in: header
          required: false
          description: The ordinal number of this chunk, e.g. the first chunk is 1, the second is 2 and so on.
          schema:
            type: integer
            minimum: 1
        - name: uploader-chunks-total
          in: header
          required: false
          description: The total number of chunks that compose the file. `1` means this is the complete file.
          schema:
            type: integer
            minimum: 1
        - name: archived
          in: query
          required: false
          description: |
            Whether the uploaded file is marked as archived. Files uploaded through the API are archived by
            default; pass `archived=false` to upload a non-archived file.
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "true"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The file/chunk to be uploaded.
              required:
                - file
      responses:
        "200":
          description: |
            The stored file (or the file the chunk was appended to). The `fileId` can be used to upload more
            chunks for the same file, or in other endpoints to reference this file.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
              example:
                length: 146737
                chunkSize: 261120
                uploadDate: 2020-07-24T20:23:38.565Z
                filename: chart1.png
                md5: 1d0ed5eb2cacbab4526de272837102dd
                metadata:
                  userId: 5f15d59cef81ecb3344fab55
                contentType: image/png
                fileId: 8cb8fed0-0cd8-4478-8372-9f7cb4eb16e3
        "401":
          $ref: "#/components/responses/Unauthorized"
        "413":
          description: The payload exceeds the maximum allowed size.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The request is not `multipart/form-data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: File uploads are temporarily disabled because the system is at capacity (circuit breaker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "507":
          description: The user has exceeded their file storage quota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Files
      summary: Delete all user files
      operationId: deleteFiles
      description: |
        Deletes all files of the current user that match the optional `filter`. The deletion runs as a
        background task; the response contains a `ticket` identifying it.

        Example: `DELETE /files?filter=filename:~invoice` deletes all of the user's files with `invoice`
        in the name.
      parameters:
        - $ref: "#/components/parameters/FileFilterParam"
        - $ref: "#/components/parameters/FileIncludeComponentSourceFilesParam"
      responses:
        "200":
          description: The background deletion task was started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileDeleteTicket"
              example:
                ticket: 3f2c1b8e-6a7d-4a55-9b1e-2f1d2a3b4c5d
        "401":
          $ref: "#/components/responses/Unauthorized"
  /files/count:
    get:
      tags:
        - Files
      summary: Get number of files
      operationId: getFilesCount
      description: Returns the number of files of the current user that match the filter. Used for paging.
      parameters:
        - $ref: "#/components/parameters/FileFilterParam"
        - $ref: "#/components/parameters/FileIncludeComponentSourceFilesParam"
      responses:
        "200":
          description: Number of matching files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileCount"
              example:
                count: 2
        "401":
          $ref: "#/components/responses/Unauthorized"
  /files/metadata/{fileId}:
    get:
      tags:
        - Files
      summary: Get file info
      operationId: getFileMetadata
      description: |
        Get the information for the specified file. The file content is not included. Only the owner of
        the file or a user with the `admin` scope can access it.
      parameters:
        - $ref: "#/components/parameters/FileIdParam"
      responses:
        "200":
          description: File metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/File"
              example:
                length: 146737
                chunkSize: 261120
                uploadDate: 2020-07-24T19:19:49.755Z
                filename: chart1.png
                md5: 1d0ed5eb2cacbab4526de272837102dd
                metadata:
                  userId: 5f15d59cef81ecb3344fab55
                contentType: image/png
                fileId: f179c163-2ad8-4f9d-bce5-95200691b7f9
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /files/{fileId}:
    delete:
      tags:
        - Files
      summary: Remove file
      operationId: deleteFile
      description: |
        Removes the specified file. Only the owner of the file or a user with the `admin` scope can
        remove it.
      parameters:
        - $ref: "#/components/parameters/FileIdParam"
      responses:
        "200":
          description: The file was removed. The response body is an empty object.
          content:
            application/json:
              schema:
                type: object
              example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /stores:
    get:
      tags:
        - Data Stores
      summary: Get All Stores
      operationId: getDataStores
      description: |
        Get all key-value stores of the current user. A default store is created for the user if it does
        not exist yet. Stores that are pending deletion are not returned.
      responses:
        "200":
          description: List of stores.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataStore"
              example:
                - name: My Store 1
                  storeId: 5c6fc9932ff3ff000747ead4
                - name: My Store 2
                  storeId: 2a3fc9512bb3fca23747lai2
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags:
        - Data Stores
      summary: Create a new Store
      operationId: createDataStore
      description: Create a new key-value store. Returns the newly created Store ID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStoreName"
            example:
              name: My Store
      responses:
        "200":
          description: The store was created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  storeId:
                    type: string
                    description: ID of the new store.
                required:
                  - storeId
              example:
                storeId: 5c7f9bfe51dbaf0007f08db0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Data store writes are temporarily disabled because the system is at capacity (circuit breaker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /stores/{storeId}:
    get:
      tags:
        - Data Stores
      summary: Get One Store metadata
      operationId: getDataStore
      description: |
        Get the name of a store. If the store does not exist, does not belong to the current user, or is
        pending deletion, the response is empty.
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
      responses:
        "200":
          description: Store metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStore"
              example:
                name: My Store 1
                storeId: 5c6fc9932ff3ff000747ead4
        "204":
          description: The store was not found (the handler returns `null`).
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags:
        - Data Stores
      summary: Rename a Store
      operationId: renameDataStore
      description: Rename an existing store. Returns the old name of the store.
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DataStoreName"
            example:
              name: My New Name
      responses:
        "200":
          description: The store was renamed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  oldName:
                    type: string
                  storeId:
                    type: string
              example:
                oldName: My Old Store Name
                storeId: 5c7f9bfe51dbaf0007f08db0
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Data store writes are temporarily disabled because the system is at capacity (circuit breaker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      tags:
        - Data Stores
      summary: Delete a Store
      operationId: deleteDataStore
      description: |
        Delete a store and all the records in the store. The store is marked for deletion immediately and
        its records are removed by a background job.
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
      responses:
        "200":
          description: The store was marked for deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStore"
              example:
                name: My Store
                storeId: 5c7f9bfe51dbaf0007f08db0
        "401":
          $ref: "#/components/responses/Unauthorized"
  /store:
    get:
      tags:
        - Data Stores
      summary: Get Store Records
      operationId: getDataStoreItems
      description: |
        Get records. Supports search and pagination.

        `pattern` is a regular expression matched against both the `key` and the `value` of every record;
        a record is included if either matches. The pattern is not anchored. The key is matched
        case-sensitively; the value is matched case-insensitively and `.` also matches newlines. Remember to
        URL-encode the pattern.

        Set `escapePattern=true` to search for the pattern literally instead of as a regular expression
        (recommended when the pattern comes from user input). Escaping is applied only when the value is
        exactly `true`.

        When paginating through search results, pass the same `pattern` and `escapePattern` to both
        `/store` and `/store/count` so that the total count matches the records you list.
      parameters:
        - name: storeId
          in: query
          required: false
          description: Store ID. If omitted, records of all the stores of the current user are returned.
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: |
            Store record property to sort by, followed by `:` and the sort order `-1` (descending) or `1`
            (ascending), e.g. `updatedAt:-1`.
          schema:
            type: string
          example: updatedAt:-1
        - name: offset
          in: query
          required: false
          description: Index of the first record returned.
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of records returned.
          schema:
            type: integer
            default: 1000
        - $ref: "#/components/parameters/DataStorePatternParam"
        - $ref: "#/components/parameters/DataStoreEscapePatternParam"
      responses:
        "200":
          description: List of store records.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataStoreItem"
              example:
                - key: Box 8RE1
                  storeId: 5b214ba6f90a6200113abfd8
                  userId: 583c06511afb7b0016ef120b
                  updatedAt: 2019-03-06T10:02:20.419Z
                  value: "321"
                  createdAt: 2019-03-06T10:02:20.419Z
                - key: T-shirt T41B
                  storeId: 5b214ba6f90a6200113abfd8
                  userId: 583c06511afb7b0016ef120b
                  updatedAt: 2019-03-06T10:01:59.360Z
                  value: "18"
                  createdAt: 2019-03-06T10:01:59.360Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags:
        - Data Stores
      summary: Delete Store Items
      operationId: deleteDataStoreItems
      description: Delete one or multiple items from one or more stores.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              description: Items to delete.
              items:
                $ref: "#/components/schemas/DataStoreItemRef"
            example:
              - key: mykey
                storeId: 5c7f9bfe51dbaf0007f08db0
              - key: mykey2
                storeId: 5c7f9bfe51dbaf0007f08db0
      responses:
        "200":
          description: Number of deleted items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedCount:
                    type: integer
              example:
                deletedCount: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /store/count:
    get:
      tags:
        - Data Stores
      summary: Get Number of Records in a Store
      operationId: getDataStoreItemsCount
      description: |
        Get the number of records in a store. Accepts the same `pattern` and `escapePattern` search
        parameters as Get Store Records.
      parameters:
        - name: storeId
          in: query
          required: false
          description: Store ID. If omitted, records of all the stores of the current user are counted.
          schema:
            type: string
        - $ref: "#/components/parameters/DataStorePatternParam"
        - $ref: "#/components/parameters/DataStoreEscapePatternParam"
      responses:
        "200":
          description: Number of matching records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                required:
                  - count
              example:
                count: 681
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /store/download/{storeId}:
    get:
      tags:
        - Data Stores
      summary: Download the content of a Data Store
      operationId: downloadDataStore
      description: |
        Downloads the entire store either as a CSV or a JSON file. The response is sent with
        `Content-Type: application/octet-stream` and
        `Content-Disposition: attachment; filename="<storeId>.<format>"`. The JSON format is an array of
        `{ key, value }` objects (values that are valid JSON strings are parsed).
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
        - name: format
          in: query
          required: false
          description: Download format.
          schema:
            type: string
            enum:
              - json
              - csv
            default: json
      responses:
        "200":
          description: The store content as a file attachment.
          headers:
            Content-Disposition:
              description: '`attachment; filename="<storeId>.<format>"`'
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /store/{storeId}/{key}:
    post:
      tags:
        - Data Stores
      summary: Create a new Store Item
      operationId: createDataStoreItem
      description: |
        Create a new value in the store under a key. The request body is the value itself. Fails if the key
        already exists in the store.
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
        - name: key
          in: path
          required: true
          description: Key of the record.
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/plain:
            schema:
              type: string
              description: Value to store under the key.
            example: my value
          application/json:
            schema:
              description: Any JSON value to store under the key.
      responses:
        "200":
          description: The created record.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataStoreItem"
              example:
                key: mykey
                value: myvalue
                createdAt: 2019-03-06T10:17:58.796Z
                updatedAt: 2019-03-06T10:17:58.796Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Data store writes are temporarily disabled because the system is at capacity (circuit breaker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      tags:
        - Data Stores
      summary: Update key or value of an existing store item
      operationId: updateDataStoreItem
      description: |
        Rename a key or update the value stored under the key. Updates are passed in the body payload; at
        least one of `key` and `value` is required.

        Note: the code returns the previous value as `oldValue` (and `key` is the new key, omitted if the
        key did not change), not the new value as shown in the docs example.
      parameters:
        - $ref: "#/components/parameters/DataStoreIdParam"
        - name: key
          in: path
          required: true
          description: Key of the record.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                key:
                  type:
                    - string
                    - number
                  description: New key.
                value:
                  type:
                    - string
                    - number
                  description: New value.
            example:
              key: newKey
              value: newValue
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema:
                type: object
                properties:
                  key:
                    type: string
                  value:
                    description: New value (as documented).
                  oldValue:
                    description: Previous value (as returned by the code).
                  createdAt:
                    type: string
                    format: date-time
                  updatedAt:
                    type: string
                    format: date-time
              example:
                key: New Key
                value: New Value
                createdAt: 2021-09-01T11:34:00.258+0000
                updatedAt: 2021-09-01T11:34:00.258+0000
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          description: Data store writes are temporarily disabled because the system is at capacity (circuit breaker).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /service-config:
    get:
      tags:
        - Connector Configuration
      summary: Get Services Configuration
      operationId: getServiceConfigs
      description: |
        Get a list of stored configurations. By default, only system-wide configurations (without a `scope`)
        are returned. Requires the `admin` scope.
      parameters:
        - name: pattern
          in: query
          required: false
          description: A term to filter configurations containing the pattern in their service ID (case-insensitive).
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: Sorting parameter in the form `property:1` (ascending) or `property:-1` (descending). Example `serviceId:1`.
          schema:
            type: string
          example: serviceId:1
        - name: offset
          in: query
          required: false
          description: Index of the first item returned. Useful for paging.
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          required: false
          description: Maximum number of items returned. Useful for paging.
          schema:
            type: integer
            minimum: 0
            default: 100
        - name: filter
          in: query
          required: false
          description: Filter in the form `property:value` or `property:!value`. Can be repeated.
          schema:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
        - name: scope
          in: query
          required: false
          description: Return only configurations stored for this scope. An empty value returns only system-wide configurations.
          schema:
            type: string
        - name: includeScoped
          in: query
          required: false
          description: If `true`, return system-wide configurations as well as the configurations of all scopes.
          schema:
            type: boolean
      responses:
        "200":
          description: List of service configurations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceConfig"
              example:
                - serviceId: appmixer:google
                  clientID: my-global-client-id
                  clientSecret: my-global-client-secret
                - serviceId: appmixer:evernote
                  sandbox: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags:
        - Connector Configuration
      summary: Create Service Configuration
      operationId: createServiceConfig
      description: |
        Create a new configuration for a service. The only required property of the payload is `serviceId`.
        The rest of the payload can be any key/value pairs that will be the desired configuration for the
        service. Requires the `admin` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ServiceConfig"
                - required:
                    - serviceId
            example:
              serviceId: appmixer:google
              clientID: my-global-client-id
              clientSecret: my-global-client-secret
      responses:
        "200":
          description: The stored configuration.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceConfig"
              example:
                serviceId: appmixer:google
                clientID: my-global-client-id
                clientSecret: my-global-client-secret
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /service-config/{serviceId}:
