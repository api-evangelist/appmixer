components:
  schemas:
    FlowWizardField:
      type: object
      description: One field of an Integration Template wizard.
      properties:
        type:
          type: string
          enum:
          - inspectorField
          - account
          - customField
          - text
          - image
        label:
          type: string
        tooltip:
          type: string
        placeholder:
          type: string
        source:
          type: string
          description: Path to the bound component input, `<componentId>.<descriptorPath>`.
        attrs:
          type: object
          description: Type-specific attributes (e.g. `service`, `components`, `sharedAccountId` for `account` fields).
          additionalProperties: true
        options:
          type: object
          additionalProperties: true
      additionalProperties: true
    FlowVersionType:
      type: string
      enum:
      - manual
      - autosave
      - publish
      - restore-point
    FlowSharedWith:
      type: object
      description: Sharing rule. Exactly one of `email`, `domain` or `scope` must be set.
      properties:
        email:
          type: string
          format: email
        domain:
          type: string
        scope:
          type: string
        permissions:
          type: array
          items:
            type: string
            enum:
            - read
            - start
            - stop
      required:
      - permissions
    FlowNote:
      type: object
      description: A note block displayed on the Designer canvas.
      properties:
        x:
          type: number
          description: Horizontal position on the canvas (pixels, can be negative).
        y:
          type: number
          description: Vertical position on the canvas (pixels, can be negative).
        width:
          type: number
        height:
          type: number
        content:
          type: string
          description: CommonMark Markdown displayed inside the note block.
      required:
      - x
      - y
      - width
      - height
    FlowCloneResult:
      type: object
      properties:
        cloneId:
          type: string
      required:
      - cloneId
    FlowVersion:
      type: object
      description: 'A flow version snapshot. List Versions returns metadata only; Get Version also includes

        `flow`, `notes`, `customFields` and `wizard`.

        '
      properties:
        versionId:
          type: string
          format: uuid
        flowId:
          type: string
        userId:
          type: string
          description: ID of the flow owner.
        versionNumber:
          type: integer
        type:
          $ref: '#/components/schemas/FlowVersionType'
        label:
          type:
          - string
          - 'null'
        name:
          type: string
        btime:
          type: string
          format: date-time
        flow:
          $ref: '#/components/schemas/FlowDescriptor'
        notes:
          $ref: '#/components/schemas/FlowNotes'
        customFields:
          type: object
          additionalProperties: true
        wizard:
          $ref: '#/components/schemas/FlowWizard'
      additionalProperties: true
    FlowComponent:
      type: object
      description: One component of a flow descriptor.
      properties:
        type:
          type: string
          minLength: 1
          description: Component type, e.g. `appmixer.utils.email.SendEmail`.
        label:
          type: string
        source:
          type:
          - object
          - 'null'
          description: 'Input connections, `{ <inputPort>: { <sourceComponentId>: [<outputPort>, ...] } }`.'
          additionalProperties: true
        config:
          type:
